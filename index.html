<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>پیک — AI Sales System (دمو)</title>
<meta name="theme-color" content="#0b0f14" />
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg" />
<meta name="description" content="Peyk AI Sales Automation Panel" />
<style>
/* فونت لوکال، نه CDN — این پنل ابزارِ عملیاتی است و باید بدونِ اینترنت هم
   دقیقاً همان‌طور بالا بیاید. Font Awesome هم کاملاً حذف شد: آیکن‌ها همگی
   SVG متریالِ درون‌خطی‌اند (window.icon)، پس هیچ فونتِ آیکنی لازم نیست. */
@font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Light.ttf') format('truetype');    font-weight: 300; font-display: swap; }
@font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Regular.ttf') format('truetype');  font-weight: 400; font-display: swap; }
@font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Medium.ttf') format('truetype');   font-weight: 500; font-display: swap; }
@font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Bold.ttf') format('truetype');     font-weight: 700; font-display: swap; }
/* ============================================================
   هرمس پنل v3 — کاملاً بر اساس admin_panel template
============================================================ */
:root {
  color-scheme: dark;
  --bg: #0f0f23;
  --surface: #1a1a2e;
  --surface-2: #16213e;
  --accent: #ffd700;
  --accent-soft: #ffed4e;
  --accent-dark: #b7791f;
  --text: #f3f4f6;
  --muted: #9ca3af;
  --line: rgba(255, 215, 0, .18);
  --danger: #f87171;
  --success: #4ade80;
  --info: #60a5fa;
  --warn: #fbbf24;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* الگوی مرجع این‌ها را هاردکد می‌کند — نُه شعاعِ متفاوت بین .5rem و 1rem،
     و هر سایه یک بار از نو نوشته شده. یک‌جا تعریف می‌شوند تا کامپوننت‌هایی
     که از این به بعد اضافه می‌شوند از هم جدا نیفتند. */
  --radius-sm: .55rem;  --radius-md: .7rem;  --radius-lg: 1rem;  --radius-pill: 2rem;
  --shadow-card: 0 12px 35px rgba(0,0,0,.13);
  --shadow-pop:  0 18px 40px rgba(0,0,0,.23), 0 0 20px rgba(255,215,0,.06);
  --shadow-toast: 0 15px 35px rgba(0,0,0,.3);
  --t-fast: .2s;  --t: .25s;  --t-slide: .32s cubic-bezier(.2,.8,.2,1);
  --hair: rgba(156,163,175,.12);

  /* نام‌های دیگری که تب‌های «گزارش‌ها»، «مشتریان»، «تنظیمات» و کارت لید به کار
     می‌برند — بدونِ این‌ها میله‌ی نرخ، حاشیه‌ی کارت‌ها و رنگِ «برنده» دیده نمی‌شد. */
  --ok: var(--success);
  --err: var(--danger);
  --border: rgba(156,163,175,.22);
  --panel2: rgba(156,163,175,.18);
  --text2: var(--muted);

  /* ارتفاعِ واقعیِ هدر و زیرتبِ فعال — با JS در activate() پر می‌شود
     (syncChromeHeights). پیش‌فرض‌ها فقط برای فریمِ اول‌اند، قبل از اینکه
     اسکریپت اندازه‌ی واقعی را بخواند. */
  --header-h: 4.9rem;
  --subtabs-h: 3.6rem;
}

/* --- base --- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; min-height: 100vh; color: var(--text);
  font-family: "Vazirmatn", sans-serif;
  background:
    radial-gradient(circle at 12% 5%, rgba(255, 215, 0, .07), transparent 25rem),
    linear-gradient(135deg, var(--bg), var(--surface) 52%, var(--surface-2));
}
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ============================================================
   صفحه ورود
============================================================ */
#gate {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.gate-box {
  width: min(100%, 380px); margin: 1rem;
  background: linear-gradient(145deg,rgba(26,26,46,.98),rgba(22,33,62,.9));
  border: 1px solid var(--line); border-radius: 1.25rem;
  padding: 2.5rem 2rem; box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.gate-logo {
  width: 4rem; height: 4rem; margin: 0 auto 1.5rem;
  background: linear-gradient(135deg,var(--accent),var(--accent-dark));
  border-radius: 1.25rem; display: grid; place-items: center;
  box-shadow: 0 0 22px rgba(255,215,0,.22);
  color: var(--bg); font-size: 1.5rem;
}
.gate-title { text-align: center; margin-bottom: 2rem; }
.gate-title h1 { margin: 0 0 .3rem; color: var(--accent); font-size: 1.5rem; font-weight: 700; }
.gate-title p { margin: 0; color: var(--muted); font-size: .9rem; }

/* ============================================================
   ساختار اصلی — دقیقاً مثل admin_panel
============================================================ */
.app-sidebar {
  position: fixed; inset: 0 0 0 auto; z-index: 50; width: 16rem;
  display: flex; flex-direction: column; background: rgba(26, 26, 46, .97);
  border-left: 1px solid var(--line); box-shadow: -20px 0 50px rgba(0,0,0,.25);
  transition: transform .32s cubic-bezier(.2,.8,.2,1);
}
.brand {
  display: flex; align-items: center; gap: .75rem;
  padding: 1.25rem; border-bottom: 1px solid var(--line); text-decoration: none;
}
.brand-mark {
  width: 2.75rem; height: 2.75rem; display: grid; place-items: center;
  border-radius: 1rem; color: var(--bg);
  background: linear-gradient(135deg,var(--accent),var(--accent-dark));
  box-shadow: 0 0 22px rgba(255,215,0,.22); font-size: 1.1rem; flex-shrink: 0;
}
.brand strong { color: var(--accent); display: block; font-size: 1.05rem; }
.brand small, .profile small { color: var(--muted); font-size: .8rem; }

.sidebar-nav {
  flex: 1; overflow-y: auto; padding: 1rem .75rem;
  scrollbar-width: thin; scrollbar-color: var(--accent-dark) transparent;
}
.nav-link, .nav-group-toggle {
  width: 100%; display: flex; align-items: center; gap: .8rem; padding: .72rem .85rem;
  border: 0; border-radius: .75rem; color: #d1d5db; background: transparent; text-align: right;
  font-family: inherit; font-size: .95rem; font-weight: 500; cursor: pointer;
  transition: color .2s, background .2s, transform .2s; margin-bottom: 3px;
}
.nav-link svg, .nav-group-toggle svg { width: 1.1rem; height: 1.1rem; flex-shrink: 0; }
.nav-link:hover, .nav-group-toggle:hover { color: var(--accent); background: rgba(255,215,0,.07); transform: translateX(-2px); }
.nav-link.active { color: var(--accent); background: linear-gradient(90deg,rgba(255,215,0,.12),rgba(255,215,0,.04)); box-shadow: inset -3px 0 var(--accent); }
.nav-link .nav-badge {
  margin-right: auto; background: var(--danger); color: #fff;
  font-size: .72rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; min-width: 18px; text-align: center;
}
.nav-link .nav-badge.warn { background: var(--warn); color: var(--bg); }
.nav-section { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 1rem .85rem .4rem; }

.sidebar-profile {
  margin: .75rem; padding: .8rem; display: flex; align-items: center; gap: .7rem;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: .9rem;
}
.sidebar-profile svg { color: var(--accent); }
.profile-status {
  width: .5rem; height: .5rem; margin-right: auto; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 8px var(--success);
}

.sidebar-overlay {
  position: fixed; inset: 0; z-index: 40; visibility: hidden; opacity: 0;
  background: rgba(0,0,0,.58); backdrop-filter: blur(3px); transition: .25s;
}
.menu-button {
  display: none; position: fixed; top: 1rem; right: 1rem; z-index: 60;
  width: 2.75rem; height: 2.75rem; border: 0; border-radius: 50%;
  background: var(--accent); color: var(--bg); box-shadow: 0 8px 25px rgba(0,0,0,.3);
}

/* ============================================================
   ناحیه اصلی
============================================================ */
/* ⚠️ flex:1 و min-width:0 هر دو لازم‌اند و هر کدام یک باگِ جدا را می‌بندند —
   چون #app یک فلکس‌باکس است و .app-main فرزندِ آن:
   بدونِ flex:1 مقدارِ پیش‌فرضِ `flex: 0 1 auto` یعنی «به اندازه‌ی محتوایت
   باش»، نه «فضا را پر کن». روی دسکتاپ ۱۴۴۰ این ستون ۷۶۸ پیکسل می‌شد در
   حالی که ۱۱۸۴ جا داشت — و چون به محتوا وابسته بود، با کم و زیاد شدنِ داده
   عرضش می‌پرید (همان «وقتی داده کم است تولبار جا نمی‌شود»).
   بدونِ min-width:0 مقدارِ پیش‌فرضِ min-width برای فلکس‌آیتم `auto` است،
   یعنی زیرِ عرضِ ذاتیِ محتوا کوچک نمی‌شود — روی موبایلِ ۳۷۵ سند ۵۲۸ پیکسل
   عرض می‌گرفت و کلِ پنل افقی اسکرول می‌خورد. */
.app-main { min-height: 100vh; margin-right: 16rem; display: flex; flex-direction: column; flex: 1; min-width: 0; }
.app-header {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: 1.1rem 1.5rem; background: rgba(26,26,46,.76); border-bottom: 1px solid var(--line); backdrop-filter: blur(16px);
}
.page-title h1 { margin: 0; color: var(--accent); font-size: clamp(1.2rem,3vw,1.55rem); font-weight: 700; }
.page-title p { margin: .2rem 0 0; color: var(--muted); font-size: .88rem; }
.header-actions { display: flex; align-items: center; gap: .65rem; }
.icon-button {
  width: 2.6rem; height: 2.6rem; border: 1px solid var(--line); border-radius: 50%;
  color: var(--accent); background: var(--surface-2); transition: .2s; display: grid; place-items: center;
}
.icon-button:hover { color: var(--bg); background: var(--accent); transform: translateY(-2px); }
.page-content { width: min(100%, 1600px); margin-inline: auto; padding: 1.5rem 1.5rem 3rem; }

.tab-section { display: none; animation: reveal .3s both; }
.tab-section.active { display: block; }
@keyframes reveal { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }

/* ============================================================
   کامپوننت‌ها — مطابق admin_panel
============================================================ */
.grid { display: grid; gap: 1rem; }
.grid-2 { grid-template-columns: repeat(2,minmax(0,1fr)); }
.grid-3 { grid-template-columns: repeat(3,minmax(0,1fr)); }
.grid-4 { grid-template-columns: repeat(4,minmax(0,1fr)); }
.span-2 { grid-column: span 2; }
.mb-1 { margin-bottom: 1rem; } .mb-2 { margin-bottom: 1.5rem; }

.card {
  position: relative; overflow: hidden; padding: 1.2rem;
  border: 1px solid var(--line); border-radius: 1rem;
  background: linear-gradient(145deg,rgba(26,26,46,.98),rgba(22,33,62,.9));
  box-shadow: 0 12px 35px rgba(0,0,0,.13); margin-bottom: 1.25rem;
}
.lift { transition: transform .25s, box-shadow .25s, border-color .25s; }
.lift:hover { transform: translateY(-4px); border-color: rgba(255,215,0,.38); box-shadow: 0 18px 40px rgba(0,0,0,.23), 0 0 20px rgba(255,215,0,.06); }

.section-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .8rem; margin-bottom: 1rem; }
.section-head h2, .section-head h3 { margin: 0; color: var(--accent); font-size: 1.05rem; font-weight: 600; }
.section-head h2 svg, .section-head h3 svg { margin-left: .5rem; }
.section-head p { margin: .25rem 0 0; color: var(--muted); font-size: .82rem; }

.stat { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.stat-label { color: var(--muted); font-size: .82rem; }
.stat-value { margin: .3rem 0; color: var(--accent); font-size: clamp(1.25rem,3vw,1.7rem); font-weight: 700; }
.trend { font-size: .75rem; color: var(--success); }
.trend.down { color: var(--danger); }
.stat-icon { flex: 0 0 auto; width: 3.2rem; height: 3.2rem; display: grid; place-items: center; border-radius: 1rem; background: rgba(255,215,0,.1); color: var(--accent); font-size: 1.25rem; }

/* KPI chips (alert bar) */
.kpi-row { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.kpi-chip {
  display: inline-flex; align-items: center; gap: .5rem; padding: .65rem 1rem;
  border-radius: 2rem; font-size: .9rem; font-weight: 600; cursor: pointer;
  border: 1px solid transparent; transition: .2s; font-family: inherit;
}
.kpi-chip.danger { background: rgba(239,68,68,.12); color: var(--danger); border-color: rgba(239,68,68,.25); }
.kpi-chip.warning { background: rgba(251,191,36,.11); color: var(--warn); border-color: rgba(251,191,36,.25); }
.kpi-chip.success { background: rgba(34,197,94,.12); color: var(--success); border-color: rgba(34,197,94,.25); }
.kpi-chip.info { background: rgba(96,165,250,.13); color: var(--info); border-color: rgba(96,165,250,.25); }
.kpi-chip:hover { transform: translateY(-2px); filter: brightness(1.15); }

.btn { min-height: 2.55rem; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .55rem 1rem; border: 1px solid transparent; border-radius: .7rem; font-weight: 600; font-family: inherit; transition: .2s; cursor: pointer; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { color: var(--bg); background: linear-gradient(135deg,var(--accent),var(--accent-dark)); box-shadow: 0 8px 20px rgba(255,215,0,.13); }
.btn-primary:hover { box-shadow: 0 10px 25px rgba(255,215,0,.22); }
.btn-secondary { color: var(--accent); background: rgba(255,215,0,.08); border-color: var(--line); }
.btn-secondary:hover { background: rgba(255,215,0,.15); border-color: var(--accent); }
.btn-danger { color: #fecaca; background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.25); }
.btn-danger:hover { background: rgba(239,68,68,.2); }
.btn-sm { min-height: 2rem; padding: .35rem .65rem; font-size: .78rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }

/* compat aliases for existing JS code */
button.btn { min-height: 2.55rem; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .55rem 1rem; border: 1px solid transparent; border-radius: .7rem; font-weight: 600; font-family: inherit; transition: .2s; color: var(--bg); background: linear-gradient(135deg,var(--accent),var(--accent-dark)); box-shadow: 0 8px 20px rgba(255,215,0,.13); }
button.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,215,0,.22); }
button.btn.ghost, button.btn.btn-secondary { color: var(--accent); background: rgba(255,215,0,.08); border-color: var(--line); box-shadow: none; }
button.btn.ghost:hover, button.btn.btn-secondary:hover { background: rgba(255,215,0,.15); border-color: var(--accent); }
button.btn.danger { color: #fecaca; background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.25); box-shadow: none; }
button.btn.danger:hover { background: rgba(239,68,68,.2); }
button.btn.sm { min-height: 2rem; padding: .35rem .65rem; font-size: .78rem; }
button.btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: .7rem; }

/* فرم */
.field { display: grid; gap: .4rem; margin-bottom: 1rem; }
.field label { color: #d1d5db; font-size: .82rem; font-weight: 500; }
.field-head { display: flex; align-items: center; gap: .5rem; }
.field-head label { margin-bottom: 0; }
.row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
label { display: block; margin-bottom: .4rem; color: #d1d5db; font-size: .83rem; font-weight: 500; }

/* دسته‌ی فیلدها — برای جایی که چند تنظیمِ مرتبط (مثلاً کلید/مدل/آدرسِ یک
   ارائه‌دهنده) باید زیرِ یک عنوان و مرزِ مشترک دیده شوند، نه پخش در یک
   گریدِ مسطح که معلوم نیست کدام فیلد به کدام سیستم تعلق دارد. */
.field-group { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 1rem 1.1rem; background: var(--surface-2); transition: border-color .2s, box-shadow .2s, opacity .2s; }
.field-group.inactive { opacity: .6; }
.field-group.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.field-group-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: .2rem; }
.field-group .field { margin-bottom: .7rem; }
.field-group .field:last-child { margin-bottom: 0; }

input, select, textarea {
  width: 100%; max-width: 400px; min-height: 2.7rem; padding: .62rem .8rem;
  color: var(--text); background: rgba(15,15,35,.62);
  border: 1px solid rgba(156,163,175,.22); border-radius: .68rem;
  font-family: inherit; font-size: .95rem; transition: border-color .2s, box-shadow .2s; outline: none;
}
textarea { min-height: 7rem; resize: vertical; max-width: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,215,0,.09); }
input::placeholder, textarea::placeholder { color: #6b7280; }

/* جدول */
.table-wrap { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--accent-dark) var(--surface); }
.data-table { width: 100%; min-width: 680px; border-collapse: collapse; }
.data-table th { padding: .85rem; color: var(--muted); font-size: .78rem; font-weight: 500; text-align: right; border-bottom: 1px solid rgba(156,163,175,.2); white-space: nowrap; }
.data-table td { padding: .85rem; color: #d1d5db; font-size: .84rem; border-bottom: 1px solid rgba(156,163,175,.1); }
.data-table tbody tr { transition: background .2s; }
.data-table tbody tr:hover { background: rgba(255,215,0,.035); }
.data-table tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nowrap, th.nowrap { white-space: nowrap; }
td.ellipsis { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tbody tr.clickable { cursor: pointer; }
tbody tr.drill-row > td { background: var(--bg); padding: 0; border: none; }
.drill-inner { padding: .5rem 1rem; border-right: 3px solid var(--accent); background: var(--bg); }
.drill-inner table { font-size: .8rem; }
.drill-inner thead th { background: transparent; font-size: .75rem; }
.table-caption { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin-bottom: 1rem; color: var(--muted); font-size: .82rem; flex-wrap: wrap; }

/* badge / pill */
.badge { display: inline-flex; align-items: center; gap: .3rem; padding: .28rem .55rem; border-radius: 2rem; font-size: .72rem; white-space: nowrap; font-weight: 600; }
.badge.success, .pill.ok { color: var(--success); background: rgba(34,197,94,.12); }
.badge.warning, .pill.warn { color: var(--warn); background: rgba(251,191,36,.11); }
.badge.info, .pill.info { color: var(--info); background: rgba(96,165,250,.13); }
.badge.danger, .pill.err { color: var(--danger); background: rgba(239,68,68,.12); }
.pill { display: inline-flex; align-items: center; gap: .3rem; padding: .25rem .6rem; border-radius: 2rem; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.pill.purple { color: #c084fc; background: rgba(192,132,252,.12); }

/* note/alert */
.note {
  display: flex; align-items: center; gap: .65rem; padding: .85rem 1rem;
  border: 1px solid var(--line); border-radius: .8rem;
  color: var(--text); background: var(--surface-2); margin: 1rem 0; font-size: .9rem; line-height: 1.6;
}
.note.err  { color: #fecaca; background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.25); }
.note.warn { color: var(--warn); background: rgba(251,191,36,.11); border-color: rgba(251,191,36,.25); }
.note.ok   { color: var(--success); background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.25); }
.note.info { color: var(--info); background: rgba(96,165,250,.13); border-color: rgba(96,165,250,.25); }

/* آیکن SVG (از JS) */
.icon    { width: 1rem; height: 1rem; flex-shrink: 0; fill: currentColor; display: inline-block; vertical-align: -2px; }
.icon-sm { width: .85rem; height: .85rem; vertical-align: -1px; }
.icon-lg { width: 1.3rem; height: 1.3rem; vertical-align: -3px; }

/* miscellaneous */
.muted  { color: var(--muted); }
.muted2 { color: #6b7280; }
.hidden { display: none !important; }
.spacer { flex: 1; }
.export-bar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.section-title { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 1.5rem 0 .75rem; border-bottom: 1px solid var(--line); padding-bottom: .4rem; }
.section-title:first-child { margin-top: 0; }
a.ad-link { display: inline-flex; align-items: center; gap: .35rem; color: var(--accent); background: rgba(255,215,0,.08); border: 1px solid var(--line); border-radius: .55rem; padding: .3rem .7rem; font-size: .8rem; font-weight: 500; transition: .2s; white-space: nowrap; }
a.ad-link:hover { background: rgba(255,215,0,.15); transform: translateY(-1px); }
a.ad-link.disabled { color: var(--muted); border-style: dashed; pointer-events: none; opacity: .5; background: transparent; }
code, .mono { font-family: var(--mono); font-size: .85rem; }
code { background: rgba(15,15,35,.6); border: 1px solid rgba(156,163,175,.2); border-radius: .4rem; padding: .1rem .4rem; color: var(--accent); }

/* KPI grid (compat) */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 1rem; margin-bottom: 1.25rem; }
.kpi-card { padding: 1.1rem 1.25rem; border: 1px solid var(--line); border-radius: 1rem; background: linear-gradient(145deg,rgba(26,26,46,.98),rgba(22,33,62,.9)); position: relative; overflow: hidden; transition: transform .25s, border-color .25s; }
.kpi-card:hover { transform: translateY(-4px); border-color: rgba(255,215,0,.38); }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; background: var(--kpi-color, var(--accent)); }
.kpi-label { font-size: .82rem; font-weight: 500; color: var(--muted); margin-bottom: .35rem; }
.kpi-value { font-size: 1.7rem; font-weight: 700; color: var(--kpi-color, var(--accent)); line-height: 1.2; }
.kpi-sub { font-size: .75rem; color: var(--muted); margin-top: .35rem; }

/* alert-bar (compat) */
.alert-bar { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.alert-chip { display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1rem; border-radius: 2rem; font-size: .88rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: .2s; font-family: inherit; }
.alert-chip.err  { background: rgba(239,68,68,.12); color: var(--danger); border-color: rgba(239,68,68,.25); }
.alert-chip.warn { background: rgba(251,191,36,.11); color: var(--warn); border-color: rgba(251,191,36,.25); }
.alert-chip.ok   { background: rgba(34,197,94,.12); color: var(--success); border-color: rgba(34,197,94,.25); }
.alert-chip.info { background: rgba(96,165,250,.13); color: var(--info); border-color: rgba(96,165,250,.25); }
.alert-chip:hover { transform: translateY(-2px); filter: brightness(1.15); }
.card h2 { display: flex; align-items: center; gap: .65rem; margin: 0 0 1rem; color: var(--accent); font-size: 1.05rem; font-weight: 600; }
.card h2 .icon { flex-shrink: 0; }

/* list */
.list { display: grid; gap: .75rem; }
.list-item { display: flex; align-items: center; gap: .75rem; padding-bottom: .75rem; border-bottom: 1px solid rgba(156,163,175,.1); }
.list-item:last-child { padding-bottom: 0; border-bottom: 0; }
.list-icon { width: 2.3rem; height: 2.3rem; display: grid; place-items: center; flex: 0 0 auto; border-radius: .75rem; color: var(--accent); background: rgba(255,215,0,.09); }
.list-copy { min-width: 0; flex: 1; }
.list-copy strong { display: block; font-size: .85rem; }
.list-copy small { color: var(--muted); }
.entity-avatar { width: 2.2rem; height: 2.2rem; display: grid; place-items: center; border-radius: .7rem; color: var(--accent); background: rgba(255,215,0,.1); }

/* progress */
.progress { height: .5rem; overflow: hidden; border-radius: 1rem; background: rgba(156,163,175,.12); }
.progress > span { display: block; height: 100%; width: var(--value); border-radius: inherit; background: linear-gradient(90deg,var(--accent-dark),var(--accent)); }

/* ریتمِ زنده — وقتی هنوز فاصله‌ی واقعیِ کافی برای نمودار جمع نشده (۰ یا ۱
   ارسال)، به‌جای نمونه‌ی تصادفی یا خالی‌ماندنِ جا، همین لحظه‌ی واقعی‌ای
   که سرور دارد می‌گذراند را زنده نشان می‌دهد. */
.wait-row { display: flex; align-items: center; gap: .85rem; padding: .9rem 1rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-md); }
.wait-dot { width: .65rem; height: .65rem; border-radius: 50%; background: var(--accent); flex: none; animation: waitPulse 1.4s ease-out infinite; }
@keyframes waitPulse {
  0% { box-shadow: 0 0 0 0 rgba(255,215,0,.55); }
  70% { box-shadow: 0 0 0 10px rgba(255,215,0,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); }
}
.wait-bar { position: relative; height: .4rem; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: .55rem; }
.wait-bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--accent-dark),var(--accent)); animation-name: waitCountdown; animation-timing-function: linear; animation-fill-mode: forwards; }
@keyframes waitCountdown { from { width: 100%; } to { width: 0%; } }

/* ============================================================
   کامپوننت‌هایی که الگوی مرجع ندارد و اینجا لازم است
============================================================ */

/* --- زیرتب --- مرجع اصلاً کامپوننت تب ندارد، ولی «تنظیمات» و «دانش»
   زیربخش دارند و بدون آن هر کدام یک صفحه‌ی بی‌انتها می‌شد. */
.subtabs {
  display: flex; gap: 3px; padding: 5px; margin-bottom: 1.25rem;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); overflow-x: auto; scrollbar-width: none;
}
.subtabs::-webkit-scrollbar { display: none; }
.subtab {
  display: inline-flex; align-items: center; gap: .5rem; white-space: nowrap; flex-shrink: 0;
  padding: .55rem .95rem; border: 0; border-radius: var(--radius-md);
  color: var(--muted); background: transparent; font-family: inherit;
  font-size: .88rem; font-weight: 600; cursor: pointer; transition: var(--t-fast);
}
.subtab:hover { color: var(--accent); background: rgba(255,215,0,.07); }
.subtab.active { color: var(--bg); background: linear-gradient(135deg,var(--accent),var(--accent-dark)); }
.subtab svg { width: .95rem; height: .95rem; flex-shrink: 0; }

/* --- اسکلت --- برخلاف الگوی مرجع که استاتیک است، این پنل تاخیرِ واقعی دارد
   (خواندن از دیوار، فراخوانی LLM). یک مستطیلِ نبض‌دار صادقانه‌تر از متنِ
   «در حال بارگذاری…» است: شکلِ چیزی که می‌آید را از قبل نشان می‌دهد. */
.skeleton {
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--hair) 25%, rgba(156,163,175,.22) 37%, var(--hair) 63%);
  background-size: 400% 100%; animation: sk 1.4s ease infinite;
}
@keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.skeleton-line { height: .8rem; margin-bottom: .55rem; }
.skeleton-line:last-child { width: 60%; margin-bottom: 0; }

/* --- توست --- */
.toast-stack { position: fixed; left: 1rem; bottom: 1rem; z-index: 120; display: grid; gap: .6rem; }
.toast {
  display: flex; align-items: center; gap: .65rem; max-width: 22rem;
  padding: .85rem 1rem; border: 1px solid var(--line); border-radius: .8rem;
  color: var(--text); background: var(--surface-2); box-shadow: var(--shadow-toast);
  animation: toast-in .3s both;
}
.toast svg { flex-shrink: 0; color: var(--success); }
.toast.err svg { color: var(--danger); }
.toast.warn svg { color: var(--warn); }
@keyframes toast-in { from { opacity: 0; transform: translateX(-15px); } }

/* --- مودال --- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 1rem;
  visibility: hidden; opacity: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(5px); transition: var(--t-fast);
}
.modal-backdrop.open { visibility: visible; opacity: 1; }
.modal {
  width: min(100%, 34rem); max-height: 88vh; overflow-y: auto; padding: 1.25rem;
  border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface);
  transform: translateY(20px) scale(.98); transition: var(--t);
}
.modal-backdrop.open .modal { transform: none; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.modal-head h2 { margin: 0; color: var(--accent); font-size: 1.1rem; }
/* دو ستونه در فرم‌ها — از الگوی مرجع. بدون این، هر فرمِ مودال یک ستونِ
   بلند می‌شود و دکمه‌ی ثبت زیرِ تاشدگی می‌ماند. */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 1rem; }
.form-grid .field-full { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

/* --- کلید روشن/خاموش --- */
.switch { display: inline-flex; align-items: center; gap: .6rem; cursor: pointer; }
/* ⚠️ width/height صریحاً صفر می‌شوند. قاعده‌ی عمومیِ `input {width:100%}`
   اینجا هم اعمال می‌شد و چون موبایل `max-width` را برمی‌دارد، این چک‌باکسِ
   نامرئی روی موبایل ۳۴۷px عرض و ۲.۷rem ارتفاع می‌گرفت — یعنی لمسِ هرجای آن
   ردیف، سوییچ را عوض می‌کرد. روی سوییچِ ارسالِ خودکار یعنی یک لمسِ اتفاقی
   می‌توانست ارسالِ خودکار را روشن کند. */
.switch input { position: absolute; opacity: 0; width: 0; height: 0; min-height: 0; margin: 0; pointer-events: none; }
.switch-track {
  width: 2.65rem; height: 1.4rem; padding: .18rem; border-radius: var(--radius-pill);
  background: #374151; transition: var(--t-fast); flex-shrink: 0;
}
.switch-track::after { content: ""; display: block; width: 1.04rem; height: 1.04rem; border-radius: 50%; background: #fff; transition: transform var(--t-fast); }
/* ترجمهٔ منفی چون چیدمان راست‌به‌چپ است */
.switch input:checked + .switch-track { background: var(--accent-dark); }
.switch input:checked + .switch-track::after { transform: translateX(-1.25rem); }
.switch input:focus-visible + .switch-track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- نمودار، بدون کتابخانه --- مثل الگوی مرجع: ارتفاع از --value می‌آید و
   برچسبِ محور یک ::after روی data-label است. هیچ وابستگیِ تازه‌ای لازم ندارد. */
/* ⚠️ height صریح، نه min-height. درصدِ ارتفاعِ فرزند (.chart-bar از
   --value) فقط وقتی حساب می‌شود که خودِ اجدادش height صریح داشته باشند —
   min-height برای این محاسبه کافی نیست (طبقِ خودِ اسپکِ CSS). با
   min-height، هر میله‌ی نمودار، هرجای پنل که .chart استفاده شده بود
   (ارسال دسته‌ای، ریتمِ ارسالِ خودکار)، به ارتفاعِ صفر می‌افتاد — نمودار
   ساخته می‌شد ولی هیچ میله‌ای دیده نمی‌شد. با تستِ زنده تایید شد: همین یک
   تغییر، میله‌ای که ۰px بود را به اندازه‌ی واقعیِ --value برگرداند. */
.chart { height: 220px; display: flex; align-items: flex-end; gap: clamp(.4rem,2vw,1rem); padding: 2rem .4rem 2.6rem; border-bottom: 1px solid rgba(156,163,175,.18); overflow: visible; }
/* بدونِ data-value/data-label، جایی برایشان لازم نیست — کوتاه‌تر و
   میله‌ها به‌هم فشرده‌تر (برای نمونه‌های زیاد، مثلِ پیش‌نمایشِ ریتم). */
.chart-compact { height: 130px; padding: .6rem .3rem .3rem; gap: clamp(.15rem,.6vw,.4rem); }
.chart-bar {
  position: relative; flex: 1; min-width: .9rem; max-width: 3rem; height: var(--value,0%);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  background: linear-gradient(to top,var(--accent-dark),var(--accent));
  animation: grow .8s both; transform-origin: bottom;
}
.chart-bar:hover { filter: brightness(1.15); }
/* برچسبِ محور، زیرِ میله (نامِ لید/کوتاه) */
.chart-bar::after { content: attr(data-label); position: absolute; bottom: -1.7rem; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: .68rem; white-space: nowrap; max-width: 4.2rem; overflow: hidden; text-overflow: ellipsis; }
/* مقدارِ خودِ میله، همیشه دیده می‌شود — نه فقط با hover */
.chart-bar::before { content: attr(data-value); position: absolute; top: -1.45rem; left: 50%; transform: translateX(-50%); color: var(--text); font-size: .72rem; font-weight: 600; white-space: nowrap; }
.chart-bar.err { background: linear-gradient(to top,var(--danger),#f87171); }
/* میله‌ای که به یک لید/آگهی وصل است — قابلِ کلیک، برای رفتن به همان‌جا */
.chart-bar.clickable { cursor: pointer; }
.chart-bar.clickable:hover { outline: 2px solid var(--accent); outline-offset: 2px; }
@keyframes grow { from { transform: scaleY(0); } }

/* --- تولتیپِ سفارشیِ نمودار --- به‌جای title خامِ مرورگر (کادرِ ریزِ
   سیستم‌عامل، با تاخیر، بدونِ استایل، روی لمسی اصلاً کار نمی‌کند). یک
   المانِ مشترک برای کلِ صفحه، هنگامِ hover/فوکوسِ هر .chart-bar جابه‌جا
   و پر می‌شود. */
.chart-tip {
  position: fixed; z-index: 200; pointer-events: none; max-width: 15rem;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-md);
  padding: .55rem .75rem; box-shadow: var(--shadow-pop);
  font-size: .78rem; line-height: 1.7; color: var(--text);
  opacity: 0; transform: translate(-50%, 4px); transition: opacity var(--t-fast), transform var(--t-fast);
}
.chart-tip.show { opacity: 1; transform: translate(-50%, 0); }
.chart-tip b { color: var(--accent); font-size: .92rem; }
.chart-tip small { display: block; color: var(--muted); margin-top: .15rem; font-size: .7rem; }

/* --- حالت خالی --- */
.empty-state { padding: 2.5rem 1rem; text-align: center; color: var(--muted); }
.empty-state svg { width: 2rem; height: 2rem; margin-bottom: .7rem; color: var(--accent); opacity: .7; }

/* --- نوار سلامتِ اتوماسیون --- */
.health-strip { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: .75rem; }
.health-item { display: flex; align-items: center; gap: .7rem; padding: .8rem .9rem; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(15,15,35,.45); }
.health-dot { width: .55rem; height: .55rem; border-radius: 50%; flex-shrink: 0; background: var(--muted); }
.health-dot.ok { background: var(--success); box-shadow: 0 0 8px var(--success); }
.health-dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.health-dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.health-item strong { display: block; font-size: .85rem; font-weight: 600; }
.health-item small { color: var(--muted); font-size: .75rem; }

/* ============================================================
   صندوقِ کار — فهرستِ گفتگوها در یک ستون، خودِ گفتگو در ستونِ دیگر.
   روی دسکتاپ ۳۰/۷۰، روی موبایل دو «صفحه» که با دکمه‌ی برگشت جابه‌جا
   می‌شوند. قبلاً هر لید یک کارتِ کاملِ بازِ زیرِ هم بود: برای دیدنِ لیدِ
   پنجم باید از چهار مکالمه‌ی کامل رد می‌شدید، و هیچ‌جا فهرستی نبود که
   بشود یک‌نگاه وضعیتِ همه را دید.
============================================================ */
.inbox { display: flex; gap: 1rem; align-items: stretch; }
.inbox > .card { padding: 0; margin: 0; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.inbox-list { flex: 0 0 30%; width: 30%; }
.inbox-detail { flex: 1 1 auto; min-height: 28rem; }
.inbox-head {
  padding: .65rem .85rem; border-bottom: 1px solid var(--hair); flex-shrink: 0;
  display: flex; align-items: center; gap: .5rem; font-size: .8rem; color: var(--muted);
}
.inbox-scroll { flex: 1 1 auto; min-height: 0; max-height: 68vh; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }

.inbox-row {
  display: block; width: 100%; text-align: right; color: inherit;
  background: transparent; border: 0; border-bottom: 1px solid var(--hair);
  padding: .6rem .8rem; transition: background var(--t-fast);
}
.inbox-row:hover { background: rgba(255,215,0,.06); }
.inbox-row.active { background: linear-gradient(90deg, rgba(255,215,0,.14), rgba(255,215,0,.03)); box-shadow: inset -3px 0 var(--accent); }
.inbox-row-top { display: flex; align-items: center; gap: .35rem; }
.inbox-row-name { flex: 1 1 auto; min-width: 0; font-weight: 600; font-size: .84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox-row-sub { margin-top: .1rem; color: var(--muted); font-size: .72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox-row-meta { display: flex; flex-wrap: wrap; gap: .28rem; margin-top: .35rem; }
.inbox-dot { width: .45rem; height: .45rem; border-radius: 50%; background: var(--accent); flex-shrink: 0; box-shadow: 0 0 6px var(--accent); }

/* چیپ — واحدِ کوچکِ اطلاعاتِ ردیف (روزِ انتظار، تعدادِ پیام، مرحله، …) */
.chip {
  display: inline-flex; align-items: center; gap: .2rem; white-space: nowrap;
  font-size: .68rem; padding: .1rem .42rem; border-radius: var(--radius-pill);
  background: rgba(156,163,175,.13); color: var(--muted);
}
.chip svg { width: .78rem; height: .78rem; }
.chip.ok   { background: rgba(74,222,128,.15);  color: var(--success); }
.chip.warn { background: rgba(251,191,36,.15);  color: var(--warn); }
.chip.err  { background: rgba(248,113,113,.15); color: var(--danger); }
.chip.acc  { background: rgba(255,215,0,.13);   color: var(--accent); }

/* --- ستونِ گفتگو: سر / بدنه‌ی اسکرول‌شونده / نوارِ عمل --- */
.lead-pane { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.lead-pane-head { flex-shrink: 0; display: flex; gap: .6rem; align-items: flex-start; flex-wrap: wrap; padding: .75rem 1rem; border-bottom: 1px solid var(--hair); }
.lead-pane-title { flex: 1 1 11rem; min-width: 0; }
.lead-pane-title strong { display: block; font-size: .92rem; }
.lead-pane-tools { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; margin-right: auto; }
.lead-pane-body { flex: 1 1 auto; min-height: 0; max-height: 58vh; overflow-y: auto; padding: .9rem 1rem; scrollbar-width: thin; }
.lead-pane-foot {
  flex-shrink: 0; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center;
  padding: .7rem 1rem; border-top: 1px solid var(--hair); background: rgba(15,15,35,.45);
}

/* دکمه‌ی آیکنی — کارهای فرعی (رفرش، یادداشت، کپی، آگهی، تلفن، تمامش کن)
   از نوارِ عملِ اصلی جدا می‌شوند؛ قبلاً هر ده دکمه در یک ردیفِ درهم بودند
   و «تایید و ارسال» بینشان گم می‌شد. */
.icon-btn {
  width: 2rem; height: 2rem; flex-shrink: 0; display: grid; place-items: center;
  border-radius: var(--radius-sm); border: 1px solid var(--hair);
  background: rgba(255,255,255,.03); color: var(--muted); transition: all var(--t-fast);
  text-decoration: none;
}
.icon-btn:hover { color: var(--accent); border-color: var(--line); background: rgba(255,215,0,.08); }
.icon-btn.on { color: var(--accent); border-color: var(--line); background: rgba(255,215,0,.1); }
.icon-btn.danger:hover { color: var(--danger); border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.1); }
.icon-btn[disabled] { opacity: .45; cursor: default; }
.icon-btn svg { width: 1.05rem; height: 1.05rem; }

/* --- حباب‌های گفتگو --- */
.chat { display: flex; flex-direction: column; gap: .5rem; }
.bubble {
  max-width: 82%; padding: .5rem .7rem; border-radius: var(--radius-md);
  font-size: .82rem; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere;
}
/* در RTL، flex-start سمتِ راست است: پیامِ مشتری راست، پیامِ ما چپ — همان
   قراردادی که هر پیام‌رسانِ فارسی دارد. */
.bubble.them { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--hair); border-top-right-radius: .2rem; }
.bubble.me   { align-self: flex-end;   background: rgba(255,215,0,.08); border: 1px solid var(--line); border-top-left-radius: .2rem; }
.bubble-meta { display: block; font-size: .65rem; color: var(--muted); margin-bottom: .25rem; }

/* --- پیشنهادِ هرمس --- */
.suggest {
  border: 1px solid var(--line); border-right: 3px solid var(--accent);
  border-radius: var(--radius-md); background: rgba(255,215,0,.05);
  padding: .7rem .85rem; font-size: .83rem; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere;
}
.suggest.stale { border-color: rgba(251,191,36,.3); border-right-color: var(--warn); background: rgba(251,191,36,.06); }
.suggest.plain { border-right-color: var(--muted); background: rgba(156,163,175,.06); border-color: var(--hair); }

@property --neon-angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes neon-spin { to { --neon-angle: 360deg; } }
.suggest.ai-glow { position: relative; z-index: 1; border-color: transparent !important; }
.suggest.ai-glow::after {
  content: ""; position: absolute; inset: -1px -3px -1px -1px; border-radius: inherit;
  padding: 1px; padding-right: 3px;
  background: conic-gradient(from var(--neon-angle, 0deg), var(--accent-dark) 0%, var(--accent-soft) 20%, transparent 35%, transparent 65%, var(--accent-soft) 80%, var(--accent-dark) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude;
  z-index: -1; animation: neon-spin 2.5s linear infinite; opacity: 0.9;
}
.suggest-label { display: flex; align-items: center; gap: .3rem; font-size: .7rem; color: var(--muted); margin-bottom: .35rem; }

.inbox-back { display: none; }

/* responsive */
@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2,minmax(0,1fr)); } .grid-3 { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 900px) {
  .app-sidebar { transform: translateX(102%); }
  body.sidebar-open .app-sidebar { transform: none; }
  body.sidebar-open .sidebar-overlay { visibility: visible; opacity: 1; }
  .menu-button { display: grid; place-items: center; }
  .app-main { margin-right: 0; }
  .app-header { padding-right: 4.5rem; }

  /* صندوقِ کار دو «صفحه» می‌شود، نه دو ستون: فهرست تمام‌عرض، و با انتخابِ
     یک ردیف، گفتگو جای آن را می‌گیرد و دکمه‌ی برگشت ظاهر می‌شود.

     ⚠️ اینجا فقط .subtabs sticky است، نه خودِ .inbox. اول همین‌طور امتحان
     شد (.inbox هم sticky، با top:calc(header+subtabs) تا دقیقاً زیرِ
     زیرتب‌ها بچسبد و ارتفاعش را هم به‌اندازهٔ باقی‌ماندهٔ صفحه پر کند) ولی
     .inbox تنها/آخرین فرزندِ ریشه است، پس باکسِ ایستایش دقیقاً به‌اندازه‌ی
     ارتفاعِ خودش کانتینر را پر می‌کند — بدونِ فضای اضافه‌ای که sticky برای
     رسیدن به آفستِ کامل لازم دارد، مرورگر چسبیدن را زودتر متوقف می‌کرد و
     .inbox چند ده پیکسل زیرِ زیرتب‌های همیشه-چسبان می‌رفت (تستِ زنده با
     مرورگر نشانش داد؛ margin-bottom و حتی flow-root هم حلش نکرد، چون
     مسئله ذاتیِ «المانی که هم‌زمان قد می‌کشد تا فضای باقی‌مانده را پر کند
     هم می‌خواهد به آن فضا بچسبد» است، نه یک باگِ margin).
     راه‌حلِ ساده‌تر و بی‌ریسک‌تر: فقط ارتفاعش را به فضای واقعاً باقی‌مانده
     محدود می‌کند (همان calc)، بدونِ sticky. چون این محدودیت تقریباً دقیقاً
     برابرِ فضای واقعیِ زیرِ زیرتب‌هاست، در عمل صفحه بعد از یک اسکرولِ کوتاه
     دیگر جایی برای رفتن ندارد — از آن به بعد، اسکرولِ واقعی داخلِ خودِ
     فهرست یا حباب‌های گفتگو (overflow-y:auto رویشان) اتفاق می‌افتد. */
  .inbox { flex-direction: column; gap: .75rem; height: 78vh; height: calc(100dvh - var(--header-h) - var(--subtabs-h) - 4rem); }
  .inbox-list { flex: 1 1 auto; width: auto; height: 100%; display: flex; flex-direction: column; }
  .inbox-scroll { max-height: none; flex: 1 1 auto; overflow-y: auto; }
  .inbox.detail-open .inbox-list { display: none; }
  .inbox:not(.detail-open) .inbox-detail { display: none; }
  .inbox-detail { height: 100%; display: flex; flex-direction: column; }
  .lead-pane-body { max-height: none; flex: 1 1 auto; overflow-y: auto; }
  .inbox-back { display: grid; }

  /* زیرتب‌ها (بی‌پاسخ/صف تایید/… و همینطور دانش/تنظیمات) درست زیرِ هدر
     می‌چسبند — روی «امروز» یعنی هنگامِ اسکرولِ فهرست یا خودِ گفتگو، تبی
     که رویش هستید همیشه در دسترس می‌ماند، نه اینکه بالای صفحه گم شود. */
  .subtabs { position: sticky; top: var(--header-h); z-index: 20; }
}
@media (max-width: 640px) {
  .page-content { padding: 1rem .8rem 2rem; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  /* ⚠️ کارت‌های KPI («بی‌پاسخ»، «میانه پاسخ»، …) قبلاً به‌اندازه‌ی نسخه‌ی
     دسکتاپ بودند — روی موبایل به‌تنهایی بیشترِ صفحه‌ی اول را می‌گرفتند و
     برای رسیدن به کارِ واقعی (زیرتب‌ها) باید رد می‌شدید. gap و padding و
     فونت هر سه کوچک‌تر شدند؛ کارتِ margin هم مثلِ بقیه‌ی .card ها جمع‌تر. */
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: .55rem; margin-bottom: 1rem; }
  .kpi-card { padding: .6rem .8rem; }
  .kpi-card::before { width: 3px; }
  .kpi-value { font-size: 1.1rem; }
  .kpi-label { font-size: .68rem; margin-bottom: .15rem; }
  .kpi-sub { font-size: .64rem; margin-top: .2rem; }
  .card { margin-bottom: 1rem; }
  input, select, textarea { max-width: none; }
  /* ⚠️ فقط دکمه‌های اصلی تمام‌عرض. قبلاً «هر» دکمه‌ای تمام‌عرض می‌شد و
     نوارِ خروجی (دو دکمه‌ی کوچکِ اکسل/متن) سه ردیفِ کامل بالای صفحه
     می‌گرفت — یعنی روی موبایل باید از کنارشان رد می‌شدید تا به کار برسید. */
  button.btn:not(.btn-sm):not(.ghost) { width: 100%; }
  .lead-pane-foot button.btn { flex: 1 1 calc(50% - .5rem); width: auto !important; }
  .export-bar { gap: .5rem; }
  .export-bar button.btn { flex: 1; }
  .card { padding: 1rem; }
  /* جدول به کارت تبدیل می‌شود — سرستون از td[data-label] می‌آید، همان
     ترفندِ الگوی مرجع. جدولی که افقی اسکرول شود روی موبایل خوانده نمی‌شود. */
  .data-table.responsive { min-width: 0; }
  .data-table.responsive thead { display: none; }
  .data-table.responsive, .data-table.responsive tbody,
  .data-table.responsive tr, .data-table.responsive td { display: block; width: 100%; }
  .data-table.responsive tr { margin-bottom: .75rem; padding: .5rem; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(15,15,35,.35); }
  .data-table.responsive td { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem; text-align: left; border-bottom: 1px solid rgba(156,163,175,.08); }
  .data-table.responsive td::before { content: attr(data-label); color: var(--muted); text-align: right; }
  .data-table.responsive td:last-child { border-bottom: 0; }
}

.pg-faq details[open] { border-color: var(--line, rgba(255,215,0,.18)); }
.pg-faq details p { color: var(--muted, #9ca3af); margin: 0 0 .8rem; }
.pg-demo ul { margin: 0; padding: 0 1.2rem 0 0; display: grid; gap: .35rem; line-height: 1.9; color: var(--muted, #9ca3af); }
.pg-hero { position: relative; overflow: hidden; border-radius: var(--radius-lg, 1rem); border: 1px solid var(--line, rgba(255,215,0,.18)); background: radial-gradient(120% 140% at 80% 0%, rgba(255,215,0,.12), transparent 55%), var(--surface-2, #16213e); min-height: 13rem; display: grid; place-items: center; padding: 1.6rem 1rem; }
.pg-code { position: absolute; inset: 0; display: grid; align-content: space-around; padding: 1rem 1.4rem; direction: ltr; opacity: .22; font-family: var(--mono, monospace); font-size: .8rem; pointer-events: none; }
.pg-code code { white-space: nowrap; color: var(--accent-soft, #ffed4e); animation: pgFade 5s ease-in-out infinite; }
@keyframes pgFade { 0%,100% { opacity: .35; transform: translateX(0); } 50% { opacity: 1; transform: translateX(8px); } }
.pg-who { position: relative; text-align: center; display: grid; gap: .15rem; justify-items: center; }
.pg-who h2 { margin: .4rem 0 0; font-size: 1.5rem; color: var(--text, #f3f4f6); }
.pg-who p { margin: 0; color: var(--muted, #9ca3af); }
.pg-en { color: var(--accent, #ffd700); letter-spacing: .12em; font-size: .85rem; }
.pg-avatar { width: 6rem; height: 6rem; border-radius: 1.5rem; object-fit: cover; object-position: 28% 40%; border: 2px solid var(--accent, #ffd700); background: #111; box-shadow: 0 0 28px rgba(255,215,0,.25); }
.pg-mid-row { display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; margin-top: .9rem; padding: .7rem .8rem; border-radius: var(--radius-md, .7rem); background: rgba(0,0,0,.25); }
.pg-mid { color: var(--accent-soft, #ffed4e); letter-spacing: .06em; }
@media (prefers-reduced-motion: reduce) { .pg-code code { animation: none; opacity: .5; } }

.pg-ico { width: 1.15rem; height: 1.15rem; flex-shrink: 0; }
.pg-social { display: flex; gap: .6rem; margin-top: .8rem; }
.pg-social a { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: .8rem; color: var(--accent-soft, #ffed4e); background: rgba(255,255,255,.05); border: 1px solid var(--line, rgba(255,215,0,.25)); transition: transform .2s, background .2s; }
.pg-social a:hover { transform: translateY(-2px); background: rgba(255,215,0,.14); }
.pg-social .pg-ico { width: 1.3rem; height: 1.3rem; }

/* ---- راهنما (فهرست کنار + کارت‌های بخش) ---- */
.demo-help-btn { font-weight: 800; font-size: 1rem; color: var(--accent, #ffd700); }
.gd-top { display: grid; gap: .6rem; }
.gd-top .gd-intro { margin: 0; }
.gd-search { width: 100%; }
.gd-layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 1.1rem; align-items: start; }
.gd-side { position: sticky; top: calc(var(--header-h, 4.9rem) + .8rem); }
.gd-toc { display: grid; gap: .2rem; padding: .6rem; border-radius: var(--radius-lg, 1rem); background: var(--surface, #1a1a2e); border: 1px solid var(--line, rgba(255,215,0,.18)); }
.gd-toc-link { padding: .5rem .7rem; border-radius: .6rem; color: var(--muted, #9ca3af); text-decoration: none; font-size: .88rem; }
.gd-toc-link:hover { color: var(--text, #f3f4f6); background: rgba(255,255,255,.05); }
.gd-toc-link.active { color: var(--accent, #ffd700); background: rgba(255,215,0,.1); font-weight: 700; }
.gd-main { display: grid; gap: 1.1rem; min-width: 0; }
.gd-body { display: grid; gap: 1.1rem; }
.gd-sec { scroll-margin-top: calc(var(--header-h, 4.9rem) + 1rem); }
.gd-sec h3 { margin: 1.1rem 0 .4rem; font-size: .95rem; color: var(--text, #f3f4f6); }
.gd-intro { color: var(--text, #f3f4f6); line-height: 2; }
.gd-list, .gd-steps { margin: .3rem 0; padding: 0; list-style: none; display: grid; gap: .5rem; }
.gd-list li, .gd-steps li { padding: .65rem .8rem; border-radius: .7rem; background: rgba(255,255,255,.03); border: 1px solid var(--hair, rgba(156,163,175,.12)); line-height: 2; }
.gd-list li b, .gd-steps li b { color: var(--accent-soft, #ffed4e); }
.gd-list li span, .gd-steps li span { color: var(--muted, #b4bac4); }
.gd-steps { counter-reset: gs; }
.gd-steps li { counter-increment: gs; position: relative; padding-right: 3rem; }
.gd-steps li::before { content: counter(gs, persian); position: absolute; right: .8rem; top: .7rem; width: 1.7rem; height: 1.7rem; display: grid; place-items: center; border-radius: 50%; background: rgba(255,215,0,.14); color: var(--accent, #ffd700); font-weight: 800; font-size: .85rem; }
.gd-note { display: flex; gap: .6rem; align-items: flex-start; margin: .8rem 0 0; padding: .7rem .85rem; border-radius: .7rem; background: rgba(96,165,250,.08); border: 1px solid rgba(96,165,250,.25); line-height: 2; font-size: .9rem; }
.gd-note svg { flex-shrink: 0; margin-top: .55rem; color: var(--info, #60a5fa); }
.gd-warn { background: rgba(251,191,36,.08); border-color: rgba(251,191,36,.3); }
.gd-warn svg { color: var(--warn, #fbbf24); }
.gd-dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1rem; margin: .6rem 0; }
.gd-dl dt { color: var(--muted, #9ca3af); } .gd-dl dd { margin: 0; }
.gd-flash { animation: gdFlash 1.2s ease; }
@keyframes gdFlash { 0% { box-shadow: 0 0 0 3px rgba(255,215,0,.55); } 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); } }
@media (max-width: 860px) {
  .gd-layout { grid-template-columns: 1fr; }
  .gd-side { position: static; }
  .gd-toc { display: flex; overflow-x: auto; gap: .3rem; }
  .gd-toc-link { white-space: nowrap; }
}

/* ---- لایسنس ---- */
.lic-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.lic-head h2 { margin: 0 0 .25rem; }
.lic-badge { padding: .3rem .9rem; border-radius: 2rem; font-weight: 800; font-size: .82rem; }
.lic-badge.ok { color: var(--success, #4ade80); background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.4); }
.lic-badge.bad { color: var(--danger, #f87171); background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.4); }
.lic-badge.warn { color: var(--warn, #fbbf24); background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.4); }
.lic-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .8rem; margin: 1rem 0; }
.lic-stats > div { display: grid; gap: .2rem; padding: .8rem .9rem; border-radius: .8rem; background: rgba(255,255,255,.03); border: 1px solid var(--hair, rgba(156,163,175,.12)); }
.lic-stats small, .lic-phones small, .lic-meter small { color: var(--muted, #9ca3af); font-size: .78rem; }
.lic-stats b { font-size: 1.5rem; color: var(--accent, #ffd700); }
.lic-stats em { font-style: normal; font-size: .78rem; color: var(--muted, #9ca3af); }
.lic-meter { display: grid; gap: .35rem; margin-top: .4rem; }
.lic-meter-head { display: flex; justify-content: space-between; }
.lic-bar { height: .55rem; border-radius: 1rem; background: var(--panel2, rgba(156,163,175,.18)); overflow: hidden; }
.lic-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd700, #e0a912); border-radius: 1rem; }
.lic-phones { margin-top: 1rem; display: grid; gap: .4rem; }
.lic-phones div { display: flex; gap: .5rem; flex-wrap: wrap; }
.lic-phones code { padding: .25rem .7rem; border-radius: .6rem; background: rgba(0,0,0,.25); color: var(--accent-soft, #ffed4e); }
.lic-drop { display: flex; align-items: center; justify-content: center; gap: .6rem; padding: 1.1rem; margin-bottom: .7rem; border: 2px dashed var(--line, rgba(255,215,0,.3)); border-radius: .9rem; color: var(--muted, #9ca3af); cursor: pointer; transition: border-color .2s, background .2s; }
.lic-drop:hover, .lic-drop.over { border-color: var(--accent, #ffd700); background: rgba(255,215,0,.06); }
.lic textarea { width: 100%; }
