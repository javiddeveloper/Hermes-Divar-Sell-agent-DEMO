<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>راه‌اندازی پیک (دمو)</title>
<meta name="theme-color" content="#0b0f14" />
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg" />
<!--
  ویزاردِ راه‌اندازیِ اولیه‌ی نصبِ مشتری: ورود ← بررسیِ سیستم ← لایسنس ← نامِ
  کسب‌وکار ← هوش مصنوعی ← دیوار ← بله ← پروفایل. هر مرحله همان APIِ پنل را صدا
  می‌زند که تبِ تنظیمات صدا می‌زند؛ این صفحه فقط ترتیب و راهنما اضافه می‌کند.
  وضعیت از GET /api/panel/setup می‌آید، پس رفرش یا بازکردنِ دوباره از همان‌جا
  ادامه می‌دهد. چیزی از اینترنت لود نمی‌شود.
-->
<style>
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Medium.ttf') format('truetype'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
  :root {
    color-scheme: dark;
    --bg: #0f0f23; --surface: #1a1a2e; --surface-2: #16213e;
    --card: rgba(255, 255, 255, .025); --line: rgba(255, 215, 0, .14); --hair: rgba(156, 163, 175, .14); --hair-strong: rgba(156, 163, 175, .24);
    --text: #f3f4f6; --soft: #d1d5db; --muted: #9ca3af; --dim: #6b7280;
    --accent: #ffd700; --accent-dark: #b7791f; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; color: var(--text); font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 14px; line-height: 1.8; }
  body { background: radial-gradient(900px 500px at 88% -10%, rgba(255, 215, 0, .08), transparent 60%), radial-gradient(800px 500px at 0% 110%, rgba(96, 165, 250, .07), transparent 60%), linear-gradient(135deg, var(--bg), var(--surface) 52%, var(--surface-2)); background-attachment: fixed; padding: 28px 16px 40px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .brand-mark { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); display: grid; place-items: center; box-shadow: 0 8px 30px -10px rgba(255, 215, 0, .55); }
  .brand-mark svg { width: 24px; height: 24px; fill: var(--bg); }
  .brand b { font-size: 17px; font-weight: 700; }
  .brand span { display: block; font-size: 12px; color: var(--muted); }
  .shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); background: rgba(26, 26, 46, .85); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: 0 30px 80px -40px rgba(0, 0, 0, .8); min-height: 580px; }
  .rail { padding: 22px 18px; border-inline-end: 1px solid var(--hair); background: rgba(255, 255, 255, .015); }
  .rail h2 { margin: 0 0 14px; font-size: 12px; font-weight: 700; color: var(--dim); }
  .steps { list-style: none; margin: 0; padding: 0; }
  .step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 0 12px; position: relative; }
  .step:not(:last-child)::after { content: ''; position: absolute; inset-inline-start: 14px; top: 36px; bottom: -2px; width: 2px; background: var(--hair); }
  .step.done:not(:last-child)::after { background: linear-gradient(var(--ok), rgba(74, 222, 128, .25)); }
  .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--card); border: 1.5px solid var(--hair-strong); transition: all .3s; }
  .step.current .dot { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255, 215, 0, .13); }
  .step.done .dot { background: var(--ok); border-color: var(--ok); color: #052e16; }
  .step.skipped .dot { color: var(--dim); border-style: dashed; }
  .dot svg { width: 16px; height: 16px; }
  .dot svg path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s .05s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .step-text b { display: block; font-size: 13px; font-weight: 600; color: var(--soft); line-height: 1.5; margin-top: 4px; }
  .step.current .step-text b { color: var(--text); }
  .step-text small { display: block; font-size: 11px; color: var(--dim); line-height: 1.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.done .step-text small { color: #86efac; }
  .tag { display: inline-block; margin-inline-start: 6px; font-size: 10px; font-weight: 600; color: var(--dim); border: 1px solid var(--hair); border-radius: 999px; padding: 0 7px; vertical-align: 1px; }
  .main { padding: 30px 34px; display: flex; flex-direction: column; min-width: 0; }
  .pane { animation: in .35s ease-out; display: flex; flex-direction: column; flex: 1; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pane h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; text-wrap: balance; }
  .lead { margin: 0 0 20px; color: var(--muted); max-width: 64ch; }
  .lead b { color: var(--soft); }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; margin-bottom: 8px; }
  .full { grid-column: 1 / -1; }
  label.f { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--soft); }
  label.f em { font-style: normal; font-weight: 400; color: var(--dim); font-size: 11.5px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 13.5px; color: var(--text); background: rgba(0, 0, 0, .25); border: 1px solid var(--hair-strong); border-radius: 10px; padding: 9px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 215, 0, .13); }
  [dir=ltr] { text-align: left; }
  input[dir=ltr], textarea[dir=ltr] { font-family: var(--mono); font-size: 12.5px; }
  textarea { min-height: 100px; resize: vertical; }
  .meter { height: 4px; border-radius: 4px; background: var(--hair); overflow: hidden; margin-top: 2px; }
  .meter i { display: block; height: 100%; width: 0; transition: width .25s, background .25s; }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 24px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 11px; padding: 9px 20px; font-size: 13.5px; font-weight: 600; border: 1px solid transparent; transition: transform .12s, box-shadow .15s, background .15s, opacity .15s; }
  button.primary { color: var(--bg); background: linear-gradient(135deg, var(--accent), var(--accent-dark)); box-shadow: 0 8px 22px -10px rgba(255, 215, 0, .55); }
  button.primary:hover { transform: translateY(-1px); }
  button.ghost { color: var(--soft); background: transparent; border-color: var(--hair-strong); }
  button.ghost:hover { background: rgba(255, 255, 255, .04); }
  button.link { color: var(--muted); background: none; padding: 9px 6px; }
  button.link:hover { color: var(--text); }
  button:disabled { opacity: .5; cursor: default; transform: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spacer { flex: 1; }
  .msg { font-size: 12.5px; line-height: 1.8; padding: 9px 13px; border-radius: 10px; margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; }
  .msg.ok { color: #bbf7d0; background: rgba(74, 222, 128, .08); border: 1px solid rgba(74, 222, 128, .25); }
  .msg.bad { color: #fecaca; background: rgba(248, 113, 113, .08); border: 1px solid rgba(248, 113, 113, .3); }
  .msg.warn { color: #fde68a; background: rgba(251, 191, 36, .07); border: 1px solid rgba(251, 191, 36, .25); }
  .msg.info { color: var(--soft); background: var(--card); border: 1px solid var(--hair); }
  .msg code, .lead code, .help code { font-family: var(--mono); direction: ltr; unicode-bidi: embed; font-size: 12px; color: var(--accent); }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .2); border-top-color: currentColor; animation: rot .8s linear infinite; flex: none; margin-top: 4px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .checks { display: grid; gap: 8px; }
  .check { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--hair); opacity: 0; animation: in .35s ease-out forwards; }
  .check .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .check.ok .ic { background: rgba(74, 222, 128, .15); color: var(--ok); }
  .check.warn .ic { background: rgba(251, 191, 36, .15); color: var(--warn); }
  .check.bad .ic { background: rgba(248, 113, 113, .15); color: var(--bad); }
  .check .ic svg { width: 14px; height: 14px; }
  .check b { font-size: 13px; }
  .check span { display: block; font-size: 12px; color: var(--muted); }
  .check .val { margin-inline-start: auto; font-family: var(--mono); font-size: 12px; color: var(--soft); direction: ltr; white-space: nowrap; }
  .check .val.fa { font-family: inherit; direction: rtl; color: var(--muted); }
  .device { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 14px; background: linear-gradient(135deg, rgba(255, 215, 0, .07), rgba(96, 165, 250, .05)); border: 1px dashed rgba(255, 215, 0, .45); margin-bottom: 16px; }
  .device code { font-family: var(--mono); font-size: 19px; font-weight: 700; letter-spacing: .06em; color: var(--accent); direction: ltr; flex: 1; text-align: left; }
  .device small { display: block; font-size: 11.5px; color: var(--muted); font-family: 'Vazirmatn', Tahoma, sans-serif; letter-spacing: 0; font-weight: 400; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  .opt { text-align: start; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--hair); background: var(--card); color: var(--soft); font-weight: 600; }
  .opt small { display: block; font-weight: 400; font-size: 11px; color: var(--dim); line-height: 1.6; margin-top: 2px; }
  .opt.on { border-color: rgba(255, 215, 0, .55); background: rgba(255, 215, 0, .07); color: var(--text); box-shadow: 0 0 0 3px rgba(255, 215, 0, .09); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--hair-strong); background: var(--card); color: var(--soft); font-family: var(--mono); direction: ltr; font-size: 13px; font-weight: 500; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: rgba(255, 215, 0, .07); }
  .chip.used { opacity: .45; }
  .kv { display: grid; gap: 6px; }
  .kv div { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--hair); font-size: 13px; }
  .kv div > span:first-child { color: var(--muted); font-size: 12px; min-width: 7.5rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: rgba(255, 255, 255, .05); border: 1px solid var(--hair); }
  .pill.high { border-color: rgba(74, 222, 128, .35); color: #bbf7d0; }
  .pill.low { border-color: rgba(248, 113, 113, .3); color: #fecaca; }
  .help { margin-top: 14px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--hair); border-radius: 12px; padding: 4px 14px; background: rgba(0, 0, 0, .15); }
  .help summary { cursor: pointer; color: var(--soft); font-weight: 600; padding: 6px 0; }
  .help ol { margin: 4px 0 10px; padding-inline-start: 20px; }
  .finish { text-align: center; align-items: center; justify-content: center; }
  .big-check { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(74, 222, 128, .25), rgba(74, 222, 128, .05)); border: 2px solid rgba(74, 222, 128, .5); margin: 10px auto 18px; animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
  .big-check svg { width: 40px; height: 40px; color: var(--ok); }
  .big-check svg path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .6s .25s ease-out forwards; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .summary { text-align: start; display: grid; gap: 6px; max-width: 480px; margin: 6px auto 0; width: 100%; }
  .summary div { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--hair); font-size: 13px; }
  .summary div span { margin-inline-start: auto; font-size: 12px; color: var(--muted); }
  .s-ok { color: var(--ok); } .s-skip { color: var(--dim); }
  .foot { text-align: center; color: var(--dim); font-size: 11.5px; margin-top: 16px; }
  @media (max-width: 760px) {
    body { padding: 16px 12px 28px; }
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail { border-inline-end: 0; border-bottom: 1px solid var(--hair); padding: 14px; }
    .rail h2 { display: none; }
    .steps { display: flex; gap: 6px; overflow-x: auto; }
    .step { grid-template-columns: 30px; padding: 0; }
    .step::after, .step-text { display: none; }
    .main { padding: 22px 16px; }
    .fields, .cards { grid-template-columns: minmax(0, 1fr); }
    .check .val { display: none; }
    .device code { font-size: 15px; letter-spacing: .02em; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .check { opacity: 1; } .dot svg path, .big-check svg path { stroke-dashoffset: 0; } }
</style>
<style>/* پوسته‌ی دمو — با متغیرهای خودِ پنل، تا چیزی از بیرون چسبانده‌شده به‌نظر نرسد */

.demo-hint {
  margin: -.2rem 0 1rem; padding: .55rem .8rem; border-radius: var(--radius-md, .7rem);
  background: rgba(255, 215, 0, .08); border: 1px dashed rgba(255, 215, 0, .35);
  color: var(--accent-soft, #ffed4e); font-size: .85rem; text-align: center;
}
.demo-hint b { letter-spacing: .12em; }

.demo-chip {
  display: inline-flex; align-items: center; padding: .15rem .6rem; border-radius: 2rem;
  background: rgba(255, 215, 0, .14); border: 1px solid rgba(255, 215, 0, .45);
  color: var(--accent, #ffd700); font-size: .72rem; font-weight: 800; letter-spacing: .14em;
}

/* ---- سوییچ کسب‌وکار ---- */
.biz-switch { position: relative; }
.biz-chip {
  display: inline-flex; align-items: center; gap: .5rem; max-width: 19rem; cursor: pointer;
  padding: .38rem .8rem; border-radius: 2rem; font: inherit; font-size: .82rem; color: var(--text, #f3f4f6);
  background: var(--surface, #1a1a2e); border: 1px solid var(--line, rgba(255,215,0,.18));
  transition: border-color .2s, background .2s;
}
.biz-chip:hover { border-color: var(--accent, #ffd700); }
.biz-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.biz-dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--success, #4ade80); box-shadow: 0 0 8px var(--success, #4ade80); flex: none; }
.biz-caret { color: var(--muted, #9ca3af); font-size: .7rem; }
.biz-switch.busy .biz-chip { opacity: .6; pointer-events: none; }
.biz-switch.busy .biz-dot { background: var(--warn, #fbbf24); box-shadow: 0 0 8px var(--warn, #fbbf24); animation: bizPulse 1s infinite; }
@keyframes bizPulse { 50% { opacity: .3; } }

.biz-menu {
  position: absolute; top: calc(100% + .45rem); inset-inline-end: 0; z-index: 60; min-width: 18rem; padding: .35rem;
  background: var(--surface, #1a1a2e); border: 1px solid var(--line, rgba(255,215,0,.18));
  border-radius: var(--radius-md, .7rem); box-shadow: var(--shadow-pop, 0 18px 40px rgba(0,0,0,.4));
}
.biz-menu[hidden] { display: none; }
.biz-item {
  display: grid; gap: .1rem; width: 100%; padding: .6rem .75rem; text-align: right; cursor: pointer;
  background: transparent; border: 0; border-radius: var(--radius-sm, .55rem); color: var(--text, #f3f4f6); font: inherit;
  position: relative;
}
.biz-item:hover { background: rgba(255, 215, 0, .08); }
.biz-item.on { background: rgba(255, 215, 0, .12); cursor: default; }
.biz-item-name { font-weight: 700; font-size: .86rem; }
.biz-item-meta { color: var(--muted, #9ca3af); font-size: .72rem; }
.biz-item-badge {
  position: absolute; inset-inline-start: .7rem; top: .65rem; font-size: .66rem; padding: .05rem .5rem;
  border-radius: 2rem; background: rgba(74, 222, 128, .15); color: var(--success, #4ade80);
}

/* ---- کارت «نسخه‌ی دمو» در سایدبار ---- */
.demo-flag {
  margin: .6rem .8rem; padding: .7rem .8rem; border-radius: var(--radius-md, .7rem);
  background: rgba(255, 215, 0, .07); border: 1px solid rgba(255, 215, 0, .28); font-size: .8rem;
}
.demo-flag-title { display: flex; align-items: center; gap: .45rem; font-weight: 800; color: var(--accent, #ffd700); }
.demo-flag-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent, #ffd700); box-shadow: 0 0 8px var(--accent, #ffd700); }
.demo-flag-sub { color: var(--muted, #9ca3af); margin: .15rem 0 .45rem; font-size: .74rem; }
.demo-flag-more { margin: .3rem 0 .5rem; }
.demo-flag-more summary { cursor: pointer; color: var(--text, #f3f4f6); font-size: .76rem; }
.demo-flag-more select {
  width: 100%; margin-top: .4rem; padding: .35rem .5rem; font: inherit; font-size: .76rem; color: var(--text, #f3f4f6);
  background: var(--bg, #0f0f23); border: 1px solid var(--line, rgba(255,215,0,.18)); border-radius: var(--radius-sm, .55rem);
}
.demo-flag-reset {
  margin-top: .4rem; width: 100%; padding: .3rem; font: inherit; font-size: .72rem; cursor: pointer;
  color: var(--muted, #9ca3af); background: transparent; border: 1px dashed var(--hair, rgba(156,163,175,.3)); border-radius: var(--radius-sm, .55rem);
}
.demo-flag-reset:hover { color: var(--text, #f3f4f6); border-color: var(--muted, #9ca3af); }
.demo-flag-cta { display: block; margin-top: .2rem; color: var(--accent-soft, #ffed4e); font-weight: 700; font-size: .78rem; text-decoration: none; }
.demo-flag-cta:hover { text-decoration: underline; }

/* ---- ویزارد ---- */
.demo-setup-banner {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 90; padding: .6rem 1rem; text-align: center; font-size: .82rem;
  background: rgba(15, 15, 35, .96); border-top: 1px solid rgba(255, 215, 0, .4); color: var(--accent-soft, #ffed4e);
}
body:has(.demo-setup-banner) { padding-bottom: 3rem; }

@media (max-width: 900px) {
  .biz-chip { max-width: 11rem; }
  .biz-menu { min-width: 15rem; }
  .demo-chip { display: none; }
}

/* متغیرهایی که تب «گزارش‌ها» و «مشتریان» استفاده می‌کنند ولی در پالتِ پنل نام دیگری دارند
   (--ok = --success …). بدونِ این‌ها میله‌ی نرخ، حاشیه‌ی کارت‌ها و رنگِ «برنده» دیده نمی‌شد. */
:root {
  --ok: var(--success, #4ade80);
  --err: var(--danger, #f87171);
  --border: rgba(156, 163, 175, .22);
  --panel2: rgba(156, 163, 175, .18);
  --text2: var(--muted, #9ca3af);
}
