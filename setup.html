<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>راه‌اندازی پیک (دمو)</title>
<meta name="theme-color" content="#0b0f14" />
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg" />
<!--
  ویزاردِ راه‌اندازیِ اولیه‌ی نصبِ مشتری: ورود ← بررسیِ سیستم ← لایسنس ← نامِ
  کسب‌وکار ← هوش مصنوعی ← دیوار ← بله ← پروفایل. هر مرحله همان APIِ پنل را صدا
  می‌زند که تبِ تنظیمات صدا می‌زند؛ این صفحه فقط ترتیب و راهنما اضافه می‌کند.
  وضعیت از GET /api/panel/setup می‌آید، پس رفرش یا بازکردنِ دوباره از همان‌جا
  ادامه می‌دهد. چیزی از اینترنت لود نمی‌شود.
-->
<style>
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Medium.ttf') format('truetype'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Vazirmatn'; src: url('fonts/Vazirmatn-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
  :root {
    color-scheme: dark;
    --bg: #0f0f23; --surface: #1a1a2e; --surface-2: #16213e;
    --card: rgba(255, 255, 255, .025); --line: rgba(255, 215, 0, .14); --hair: rgba(156, 163, 175, .14); --hair-strong: rgba(156, 163, 175, .24);
    --text: #f3f4f6; --soft: #d1d5db; --muted: #9ca3af; --dim: #6b7280;
    --accent: #ffd700; --accent-dark: #b7791f; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; color: var(--text); font-family: 'Vazirmatn', Tahoma, sans-serif; font-size: 14px; line-height: 1.8; }
  body { background: radial-gradient(900px 500px at 88% -10%, rgba(255, 215, 0, .08), transparent 60%), radial-gradient(800px 500px at 0% 110%, rgba(96, 165, 250, .07), transparent 60%), linear-gradient(135deg, var(--bg), var(--surface) 52%, var(--surface-2)); background-attachment: fixed; padding: 28px 16px 40px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .brand-mark { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); display: grid; place-items: center; box-shadow: 0 8px 30px -10px rgba(255, 215, 0, .55); }
  .brand-mark svg { width: 24px; height: 24px; fill: var(--bg); }
  .brand b { font-size: 17px; font-weight: 700; }
  .brand span { display: block; font-size: 12px; color: var(--muted); }
  .shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); background: rgba(26, 26, 46, .85); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: 0 30px 80px -40px rgba(0, 0, 0, .8); min-height: 580px; }
  .rail { padding: 22px 18px; border-inline-end: 1px solid var(--hair); background: rgba(255, 255, 255, .015); }
  .rail h2 { margin: 0 0 14px; font-size: 12px; font-weight: 700; color: var(--dim); }
  .steps { list-style: none; margin: 0; padding: 0; }
  .step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 0 12px; position: relative; }
  .step:not(:last-child)::after { content: ''; position: absolute; inset-inline-start: 14px; top: 36px; bottom: -2px; width: 2px; background: var(--hair); }
  .step.done:not(:last-child)::after { background: linear-gradient(var(--ok), rgba(74, 222, 128, .25)); }
  .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--card); border: 1.5px solid var(--hair-strong); transition: all .3s; }
  .step.current .dot { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255, 215, 0, .13); }
  .step.done .dot { background: var(--ok); border-color: var(--ok); color: #052e16; }
  .step.skipped .dot { color: var(--dim); border-style: dashed; }
  .dot svg { width: 16px; height: 16px; }
  .dot svg path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s .05s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .step-text b { display: block; font-size: 13px; font-weight: 600; color: var(--soft); line-height: 1.5; margin-top: 4px; }
  .step.current .step-text b { color: var(--text); }
  .step-text small { display: block; font-size: 11px; color: var(--dim); line-height: 1.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step.done .step-text small { color: #86efac; }
  .tag { display: inline-block; margin-inline-start: 6px; font-size: 10px; font-weight: 600; color: var(--dim); border: 1px solid var(--hair); border-radius: 999px; padding: 0 7px; vertical-align: 1px; }
  .main { padding: 30px 34px; display: flex; flex-direction: column; min-width: 0; }
  .pane { animation: in .35s ease-out; display: flex; flex-direction: column; flex: 1; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pane h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; text-wrap: balance; }
  .lead { margin: 0 0 20px; color: var(--muted); max-width: 64ch; }
  .lead b { color: var(--soft); }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; margin-bottom: 8px; }
  .full { grid-column: 1 / -1; }
  label.f { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--soft); }
  label.f em { font-style: normal; font-weight: 400; color: var(--dim); font-size: 11.5px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 13.5px; color: var(--text); background: rgba(0, 0, 0, .25); border: 1px solid var(--hair-strong); border-radius: 10px; padding: 9px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 215, 0, .13); }
  [dir=ltr] { text-align: left; }
  input[dir=ltr], textarea[dir=ltr] { font-family: var(--mono); font-size: 12.5px; }
  textarea { min-height: 100px; resize: vertical; }
  .meter { height: 4px; border-radius: 4px; background: var(--hair); overflow: hidden; margin-top: 2px; }
  .meter i { display: block; height: 100%; width: 0; transition: width .25s, background .25s; }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 24px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 11px; padding: 9px 20px; font-size: 13.5px; font-weight: 600; border: 1px solid transparent; transition: transform .12s, box-shadow .15s, background .15s, opacity .15s; }
  button.primary { color: var(--bg); background: linear-gradient(135deg, var(--accent), var(--accent-dark)); box-shadow: 0 8px 22px -10px rgba(255, 215, 0, .55); }
  button.primary:hover { transform: translateY(-1px); }
  button.ghost { color: var(--soft); background: transparent; border-color: var(--hair-strong); }
  button.ghost:hover { background: rgba(255, 255, 255, .04); }
  button.link { color: var(--muted); background: none; padding: 9px 6px; }
  button.link:hover { color: var(--text); }
  button:disabled { opacity: .5; cursor: default; transform: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spacer { flex: 1; }
  .msg { font-size: 12.5px; line-height: 1.8; padding: 9px 13px; border-radius: 10px; margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; }
  .msg.ok { color: #bbf7d0; background: rgba(74, 222, 128, .08); border: 1px solid rgba(74, 222, 128, .25); }
  .msg.bad { color: #fecaca; background: rgba(248, 113, 113, .08); border: 1px solid rgba(248, 113, 113, .3); }
  .msg.warn { color: #fde68a; background: rgba(251, 191, 36, .07); border: 1px solid rgba(251, 191, 36, .25); }
  .msg.info { color: var(--soft); background: var(--card); border: 1px solid var(--hair); }
  .msg code, .lead code, .help code { font-family: var(--mono); direction: ltr; unicode-bidi: embed; font-size: 12px; color: var(--accent); }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .2); border-top-color: currentColor; animation: rot .8s linear infinite; flex: none; margin-top: 4px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .checks { display: grid; gap: 8px; }
  .check { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--hair); opacity: 0; animation: in .35s ease-out forwards; }
  .check .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .check.ok .ic { background: rgba(74, 222, 128, .15); color: var(--ok); }
  .check.warn .ic { background: rgba(251, 191, 36, .15); color: var(--warn); }
  .check.bad .ic { background: rgba(248, 113, 113, .15); color: var(--bad); }
  .check .ic svg { width: 14px; height: 14px; }
  .check b { font-size: 13px; }
  .check span { display: block; font-size: 12px; color: var(--muted); }
  .check .val { margin-inline-start: auto; font-family: var(--mono); font-size: 12px; color: var(--soft); direction: ltr; white-space: nowrap; }
  .check .val.fa { font-family: inherit; direction: rtl; color: var(--muted); }
  .device { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 14px; background: linear-gradient(135deg, rgba(255, 215, 0, .07), rgba(96, 165, 250, .05)); border: 1px dashed rgba(255, 215, 0, .45); margin-bottom: 16px; }
  .device code { font-family: var(--mono); font-size: 19px; font-weight: 700; letter-spacing: .06em; color: var(--accent); direction: ltr; flex: 1; text-align: left; }
  .device small { display: block; font-size: 11.5px; color: var(--muted); font-family: 'Vazirmatn', Tahoma, sans-serif; letter-spacing: 0; font-weight: 400; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  .opt { text-align: start; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--hair); background: var(--card); color: var(--soft); font-weight: 600; }
  .opt small { display: block; font-weight: 400; font-size: 11px; color: var(--dim); line-height: 1.6; margin-top: 2px; }
  .opt.on { border-color: rgba(255, 215, 0, .55); background: rgba(255, 215, 0, .07); color: var(--text); box-shadow: 0 0 0 3px rgba(255, 215, 0, .09); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--hair-strong); background: var(--card); color: var(--soft); font-family: var(--mono); direction: ltr; font-size: 13px; font-weight: 500; }
  .chip.on { border-color: var(--accent); color: var(--accent); background: rgba(255, 215, 0, .07); }
  .chip.used { opacity: .45; }
  .kv { display: grid; gap: 6px; }
  .kv div { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--hair); font-size: 13px; }
  .kv div > span:first-child { color: var(--muted); font-size: 12px; min-width: 7.5rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: rgba(255, 255, 255, .05); border: 1px solid var(--hair); }
  .pill.high { border-color: rgba(74, 222, 128, .35); color: #bbf7d0; }
  .pill.low { border-color: rgba(248, 113, 113, .3); color: #fecaca; }
  .help { margin-top: 14px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--hair); border-radius: 12px; padding: 4px 14px; background: rgba(0, 0, 0, .15); }
  .help summary { cursor: pointer; color: var(--soft); font-weight: 600; padding: 6px 0; }
  .help ol { margin: 4px 0 10px; padding-inline-start: 20px; }
  .finish { text-align: center; align-items: center; justify-content: center; }
  .big-check { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(74, 222, 128, .25), rgba(74, 222, 128, .05)); border: 2px solid rgba(74, 222, 128, .5); margin: 10px auto 18px; animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
  .big-check svg { width: 40px; height: 40px; color: var(--ok); }
  .big-check svg path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .6s .25s ease-out forwards; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .summary { text-align: start; display: grid; gap: 6px; max-width: 480px; margin: 6px auto 0; width: 100%; }
  .summary div { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--hair); font-size: 13px; }
  .summary div span { margin-inline-start: auto; font-size: 12px; color: var(--muted); }
  .s-ok { color: var(--ok); } .s-skip { color: var(--dim); }
  .foot { text-align: center; color: var(--dim); font-size: 11.5px; margin-top: 16px; }
  @media (max-width: 760px) {
    body { padding: 16px 12px 28px; }
    .shell { grid-template-columns: minmax(0, 1fr); }
    .rail { border-inline-end: 0; border-bottom: 1px solid var(--hair); padding: 14px; }
    .rail h2 { display: none; }
    .steps { display: flex; gap: 6px; overflow-x: auto; }
    .step { grid-template-columns: 30px; padding: 0; }
    .step::after, .step-text { display: none; }
    .main { padding: 22px 16px; }
    .fields, .cards { grid-template-columns: minmax(0, 1fr); }
    .check .val { display: none; }
    .device code { font-size: 15px; letter-spacing: .02em; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .check { opacity: 1; } .dot svg path, .big-check svg path { stroke-dashoffset: 0; } }
</style>
<style>/* پوسته‌ی دمو — با متغیرهای خودِ پنل، تا چیزی از بیرون چسبانده‌شده به‌نظر نرسد */

.demo-hint {
  margin: -.2rem 0 1rem; padding: .55rem .8rem; border-radius: var(--radius-md, .7rem);
  background: rgba(255, 215, 0, .08); border: 1px dashed rgba(255, 215, 0, .35);
  color: var(--accent-soft, #ffed4e); font-size: .85rem; text-align: center;
}
.demo-hint b { letter-spacing: .12em; }

.demo-chip {
  display: inline-flex; align-items: center; padding: .15rem .6rem; border-radius: 2rem;
  background: rgba(255, 215, 0, .14); border: 1px solid rgba(255, 215, 0, .45);
  color: var(--accent, #ffd700); font-size: .72rem; font-weight: 800; letter-spacing: .14em;
}

/* ---- سوییچ کسب‌وکار ---- */
.biz-switch { position: relative; }
.biz-chip {
  display: inline-flex; align-items: center; gap: .5rem; max-width: 19rem; cursor: pointer;
  padding: .38rem .8rem; border-radius: 2rem; font: inherit; font-size: .82rem; color: var(--text, #f3f4f6);
  background: var(--surface, #1a1a2e); border: 1px solid var(--line, rgba(255,215,0,.18));
  transition: border-color .2s, background .2s;
}
.biz-chip:hover { border-color: var(--accent, #ffd700); }
.biz-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.biz-dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--success, #4ade80); box-shadow: 0 0 8px var(--success, #4ade80); flex: none; }
.biz-caret { color: var(--muted, #9ca3af); font-size: .7rem; }
.biz-switch.busy .biz-chip { opacity: .6; pointer-events: none; }
.biz-switch.busy .biz-dot { background: var(--warn, #fbbf24); box-shadow: 0 0 8px var(--warn, #fbbf24); animation: bizPulse 1s infinite; }
@keyframes bizPulse { 50% { opacity: .3; } }

.biz-menu {
  position: absolute; top: calc(100% + .45rem); inset-inline-end: 0; z-index: 60; min-width: 18rem; padding: .35rem;
  background: var(--surface, #1a1a2e); border: 1px solid var(--line, rgba(255,215,0,.18));
  border-radius: var(--radius-md, .7rem); box-shadow: var(--shadow-pop, 0 18px 40px rgba(0,0,0,.4));
}
.biz-menu[hidden] { display: none; }
.biz-item {
  display: grid; gap: .1rem; width: 100%; padding: .6rem .75rem; text-align: right; cursor: pointer;
  background: transparent; border: 0; border-radius: var(--radius-sm, .55rem); color: var(--text, #f3f4f6); font: inherit;
  position: relative;
}
.biz-item:hover { background: rgba(255, 215, 0, .08); }
.biz-item.on { background: rgba(255, 215, 0, .12); cursor: default; }
.biz-item-name { font-weight: 700; font-size: .86rem; }
.biz-item-meta { color: var(--muted, #9ca3af); font-size: .72rem; }
.biz-item-badge {
  position: absolute; inset-inline-start: .7rem; top: .65rem; font-size: .66rem; padding: .05rem .5rem;
  border-radius: 2rem; background: rgba(74, 222, 128, .15); color: var(--success, #4ade80);
}

/* ---- کارت شناور «نسخه‌ی دمو» — پایین، سمت چپ ---- */
.demo-flag {
  position: fixed; left: 1rem; bottom: 1rem; z-index: 60; direction: rtl;
  display: flex; align-items: center; gap: .8rem; padding: .55rem .6rem .55rem .7rem;
  border-radius: 1rem; font-size: .8rem; max-width: calc(100vw - 2rem);
  background: rgba(26, 26, 46, .92); backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 215, 0, .4); box-shadow: 0 12px 32px rgba(0,0,0,.45), 0 0 18px rgba(255,215,0,.1);
}
.demo-flag-info { display: grid; gap: .05rem; min-width: 0; }
.demo-flag-title { display: flex; align-items: center; gap: .45rem; font-weight: 800; color: var(--accent, #ffd700); white-space: nowrap; }
.demo-flag-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent, #ffd700); box-shadow: 0 0 8px var(--accent, #ffd700); animation: flagPulse 2s ease-in-out infinite; }
@keyframes flagPulse { 50% { opacity: .35; } }
.demo-flag-sub { color: var(--muted, #9ca3af); font-size: .72rem; white-space: nowrap; }
.demo-flag-cta {
  white-space: nowrap; padding: .5rem .85rem; border-radius: .7rem; font-weight: 800; font-size: .78rem; text-decoration: none;
  color: #1a1400; background: linear-gradient(135deg, #ffd700, #e0a912);
}
.demo-flag-cta:hover { filter: brightness(1.08); }
.demo-flag-more { position: relative; }
.demo-flag-more summary {
  list-style: none; cursor: pointer; width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: .6rem;
  color: var(--muted, #9ca3af); border: 1px solid var(--hair, rgba(156,163,175,.25)); font-size: 1rem;
}
.demo-flag-more summary::-webkit-details-marker { display: none; }
.demo-flag-more[open] summary { color: var(--accent, #ffd700); border-color: var(--accent, #ffd700); }
.demo-flag-pop {
  position: absolute; left: 0; bottom: calc(100% + .6rem); width: 14rem; display: grid; gap: .45rem; padding: .7rem;
  background: var(--surface, #1a1a2e); border: 1px solid var(--line, rgba(255,215,0,.25)); border-radius: .8rem; box-shadow: 0 12px 30px rgba(0,0,0,.5);
}
.demo-flag-pop label { font-size: .74rem; color: var(--muted, #9ca3af); }
.demo-flag-pop select {
  width: 100%; padding: .35rem .5rem; font: inherit; font-size: .76rem; color: var(--text, #f3f4f6);
  background: var(--bg, #0f0f23); border: 1px solid var(--line, rgba(255,215,0,.18)); border-radius: var(--radius-sm, .55rem);
}
.demo-flag-reset {
  padding: .35rem; font: inherit; font-size: .74rem; cursor: pointer;
  color: var(--muted, #9ca3af); background: transparent; border: 1px dashed var(--hair, rgba(156,163,175,.3)); border-radius: var(--radius-sm, .55rem);
}
.demo-flag-reset:hover { color: var(--text, #f3f4f6); border-color: var(--muted, #9ca3af); }
@media (max-width: 560px) { .demo-flag-sub { display: none; } .demo-flag { left: .5rem; bottom: .5rem; } }

/* ---- ویزارد ---- */
.demo-setup-banner {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 90; padding: .6rem 1rem; text-align: center; font-size: .82rem;
  background: rgba(15, 15, 35, .96); border-top: 1px solid rgba(255, 215, 0, .4); color: var(--accent-soft, #ffed4e);
}
body:has(.demo-setup-banner) { padding-bottom: 3rem; }

@media (max-width: 900px) {
  .biz-chip { max-width: 11rem; }
  .biz-menu { min-width: 15rem; }
  .demo-chip { display: none; }
}

/* میله‌ی نرخ در تب «گزارش‌ها» — در دمو کمی پهن‌تر تا با داده‌ی نمونه خوانا باشد */
td[data-label=""] > div[style*="height:6px"] { width: 140px !important; height: 8px !important; border-radius: 4px !important; }

/* ---- صفحه‌های «راهنما» و «درباره ما» ---- */
.pg { display: grid; gap: 1.1rem; width: 100%; }
.pg-card { background: var(--surface, #1a1a2e); border: 1px solid var(--line, rgba(255,215,0,.18)); border-radius: var(--radius-lg, 1rem); padding: 1.2rem 1.3rem; }
.pg-card h2 { display: flex; align-items: center; gap: .5rem; margin: 0 0 .7rem; font-size: 1.05rem; color: var(--accent, #ffd700); }
.pg-card p { line-height: 2; margin: .3rem 0; }
.pg-muted { color: var(--muted, #9ca3af); font-size: .88rem; }
.pg-hide { display: none !important; }
.pg-steps { list-style: none; counter-reset: s; margin: .6rem 0 0; padding: 0; display: grid; gap: .6rem; }
.pg-steps li { counter-increment: s; position: relative; padding: .7rem 3rem .7rem .8rem; background: rgba(255,255,255,.03); border: 1px solid var(--hair, rgba(156,163,175,.12)); border-radius: var(--radius-md, .7rem); display: grid; gap: .15rem; }
.pg-steps li::before { content: counter(s, persian); position: absolute; right: .8rem; top: .75rem; width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; background: rgba(255,215,0,.14); color: var(--accent, #ffd700); font-weight: 800; font-size: .85rem; }
.pg-steps li span { color: var(--muted, #9ca3af); font-size: .88rem; line-height: 1.9; }
.pg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .7rem; margin-top: .6rem; }
.pg-grid-3 { grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }
.pg-tile, .pg-mini, .pg-contact { text-align: right; font: inherit; color: inherit; text-decoration: none; background: rgba(255,255,255,.03); border: 1px solid var(--hair, rgba(156,163,175,.12)); border-radius: var(--radius-md, .7rem); padding: .85rem .9rem; display: grid; gap: .35rem; align-content: start; }
.pg-tile { cursor: pointer; transition: border-color .2s, transform .2s; }
.pg-tile:hover, .pg-contact:hover { border-color: var(--accent, #ffd700); transform: translateY(-2px); }
.pg-tile b, .pg-mini b, .pg-contact b { display: flex; align-items: center; gap: .4rem; color: var(--accent-soft, #ffed4e); }
.pg-tile span, .pg-mini span, .pg-contact span { color: var(--muted, #9ca3af); font-size: .85rem; line-height: 1.9; }
.pg-tile em, .pg-contact em { font-style: normal; font-size: .8rem; color: var(--accent, #ffd700); }
.pg-flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: .6rem; margin-top: .7rem; }
.pg-flow-item { position: relative; padding: .7rem .75rem; border-radius: var(--radius-md, .7rem); background: rgba(255,215,0,.05); border: 1px solid var(--line, rgba(255,215,0,.18)); display: grid; gap: .2rem; }
.pg-flow-item i { font-style: normal; font-weight: 800; color: var(--accent, #ffd700); font-size: .8rem; }
.pg-flow-item span { color: var(--muted, #9ca3af); font-size: .8rem; line-height: 1.8; }
.pg-three { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .7rem; }
.pg-three div { display: grid; gap: .3rem; padding: .8rem; border-radius: var(--radius-md, .7rem); background: rgba(255,255,255,.03); }
.pg-three b.ok { color: var(--success, #4ade80); } .pg-three b.bad { color: var(--danger, #f87171); } .pg-three b.mid { color: var(--warn, #fbbf24); }
.pg-three span { color: var(--muted, #9ca3af); font-size: .86rem; line-height: 1.9; }
.pg-search { width: 100%; margin: .3rem 0 .7rem; }
.pg-faq { display: grid; gap: .5rem; }
.pg-faq details { border: 1px solid var(--hair, rgba(156,163,175,.12)); border-radius: var(--radius-md, .7rem); padding: .1rem .9rem; background: rgba(255,255,255,.02); }
.pg-faq summary { cursor: pointer; padding: .7rem 0; font-weight: 600; }
.pg-faq details[open] { border-color: var(--line, rgba(255,215,0,.18)); }
.pg-faq details p { color: var(--muted, #9ca3af); margin: 0 0 .8rem; }
.pg-demo ul { margin: 0; padding: 0 1.2rem 0 0; display: grid; gap: .35rem; line-height: 1.9; color: var(--muted, #9ca3af); }
.pg-hero { position: relative; overflow: hidden; border-radius: var(--radius-lg, 1rem); border: 1px solid var(--line, rgba(255,215,0,.18)); background: radial-gradient(120% 140% at 80% 0%, rgba(255,215,0,.12), transparent 55%), var(--surface-2, #16213e); min-height: 13rem; display: grid; place-items: center; padding: 1.6rem 1rem; }
.pg-code { position: absolute; inset: 0; display: grid; align-content: space-around; padding: 1rem 1.4rem; direction: ltr; opacity: .22; font-family: var(--mono, monospace); font-size: .8rem; pointer-events: none; }
.pg-code code { white-space: nowrap; color: var(--accent-soft, #ffed4e); animation: pgFade 5s ease-in-out infinite; }
@keyframes pgFade { 0%,100% { opacity: .35; transform: translateX(0); } 50% { opacity: 1; transform: translateX(8px); } }
.pg-who { position: relative; text-align: center; display: grid; gap: .15rem; justify-items: center; }
.pg-who h2 { margin: .4rem 0 0; font-size: 1.5rem; color: var(--text, #f3f4f6); }
.pg-who p { margin: 0; color: var(--muted, #9ca3af); }
.pg-en { color: var(--accent, #ffd700); letter-spacing: .12em; font-size: .85rem; }
.pg-avatar { width: 6rem; height: 6rem; border-radius: 1.5rem; object-fit: cover; object-position: 28% 40%; border: 2px solid var(--accent, #ffd700); background: #111; box-shadow: 0 0 28px rgba(255,215,0,.25); }
.pg-mid-row { display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; margin-top: .9rem; padding: .7rem .8rem; border-radius: var(--radius-md, .7rem); background: rgba(0,0,0,.25); }
.pg-mid { color: var(--accent-soft, #ffed4e); letter-spacing: .06em; }
@media (prefers-reduced-motion: reduce) { .pg-code code { animation: none; opacity: .5; } }

.pg-ico { width: 1.15rem; height: 1.15rem; flex-shrink: 0; }
.pg-social { display: flex; gap: .6rem; margin-top: .8rem; }
.pg-social a { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: .8rem; color: var(--accent-soft, #ffed4e); background: rgba(255,255,255,.05); border: 1px solid var(--line, rgba(255,215,0,.25)); transition: transform .2s, background .2s; }
.pg-social a:hover { transform: translateY(-2px); background: rgba(255,215,0,.14); }
.pg-social .pg-ico { width: 1.3rem; height: 1.3rem; }

/* ---- راهنما (فهرست کنار + کارت‌های بخش) ---- */
.demo-help-btn { font-weight: 800; font-size: 1rem; color: var(--accent, #ffd700); }
.gd-top { display: grid; gap: .6rem; }
.gd-top .gd-intro { margin: 0; }
.gd-search { width: 100%; }
.gd-layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 1.1rem; align-items: start; }
.gd-side { position: sticky; top: calc(var(--header-h, 4.9rem) + .8rem); }
.gd-toc { display: grid; gap: .2rem; padding: .6rem; border-radius: var(--radius-lg, 1rem); background: var(--surface, #1a1a2e); border: 1px solid var(--line, rgba(255,215,0,.18)); }
.gd-toc-link { padding: .5rem .7rem; border-radius: .6rem; color: var(--muted, #9ca3af); text-decoration: none; font-size: .88rem; }
.gd-toc-link:hover { color: var(--text, #f3f4f6); background: rgba(255,255,255,.05); }
.gd-toc-link.active { color: var(--accent, #ffd700); background: rgba(255,215,0,.1); font-weight: 700; }
.gd-main { display: grid; gap: 1.1rem; min-width: 0; }
.gd-body { display: grid; gap: 1.1rem; }
.gd-sec { scroll-margin-top: calc(var(--header-h, 4.9rem) + 1rem); }
.gd-sec h3 { margin: 1.1rem 0 .4rem; font-size: .95rem; color: var(--text, #f3f4f6); }
.gd-intro { color: var(--text, #f3f4f6); line-height: 2; }
.gd-list, .gd-steps { margin: .3rem 0; padding: 0; list-style: none; display: grid; gap: .5rem; }
.gd-list li, .gd-steps li { padding: .65rem .8rem; border-radius: .7rem; background: rgba(255,255,255,.03); border: 1px solid var(--hair, rgba(156,163,175,.12)); line-height: 2; }
.gd-list li b, .gd-steps li b { color: var(--accent-soft, #ffed4e); }
.gd-list li span, .gd-steps li span { color: var(--muted, #b4bac4); }
.gd-steps { counter-reset: gs; }
.gd-steps li { counter-increment: gs; position: relative; padding-right: 3rem; }
.gd-steps li::before { content: counter(gs, persian); position: absolute; right: .8rem; top: .7rem; width: 1.7rem; height: 1.7rem; display: grid; place-items: center; border-radius: 50%; background: rgba(255,215,0,.14); color: var(--accent, #ffd700); font-weight: 800; font-size: .85rem; }
.gd-note { display: flex; gap: .6rem; align-items: flex-start; margin: .8rem 0 0; padding: .7rem .85rem; border-radius: .7rem; background: rgba(96,165,250,.08); border: 1px solid rgba(96,165,250,.25); line-height: 2; font-size: .9rem; }
.gd-note svg { flex-shrink: 0; margin-top: .55rem; color: var(--info, #60a5fa); }
.gd-warn { background: rgba(251,191,36,.08); border-color: rgba(251,191,36,.3); }
.gd-warn svg { color: var(--warn, #fbbf24); }
.gd-dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1rem; margin: .6rem 0; }
.gd-dl dt { color: var(--muted, #9ca3af); } .gd-dl dd { margin: 0; }
.gd-flash { animation: gdFlash 1.2s ease; }
@keyframes gdFlash { 0% { box-shadow: 0 0 0 3px rgba(255,215,0,.55); } 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); } }
@media (max-width: 860px) {
  .gd-layout { grid-template-columns: 1fr; }
  .gd-side { position: static; }
  .gd-toc { display: flex; overflow-x: auto; gap: .3rem; }
  .gd-toc-link { white-space: nowrap; }
}

/* ---- لایسنس ---- */
.lic-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.lic-head h2 { margin: 0 0 .25rem; }
.lic-badge { padding: .3rem .9rem; border-radius: 2rem; font-weight: 800; font-size: .82rem; }
.lic-badge.ok { color: var(--success, #4ade80); background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.4); }
.lic-badge.bad { color: var(--danger, #f87171); background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.4); }
.lic-badge.warn { color: var(--warn, #fbbf24); background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.4); }
.lic-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .8rem; margin: 1rem 0; }
.lic-stats > div { display: grid; gap: .2rem; padding: .8rem .9rem; border-radius: .8rem; background: rgba(255,255,255,.03); border: 1px solid var(--hair, rgba(156,163,175,.12)); }
.lic-stats small, .lic-phones small, .lic-meter small { color: var(--muted, #9ca3af); font-size: .78rem; }
.lic-stats b { font-size: 1.5rem; color: var(--accent, #ffd700); }
.lic-stats em { font-style: normal; font-size: .78rem; color: var(--muted, #9ca3af); }
.lic-meter { display: grid; gap: .35rem; margin-top: .4rem; }
.lic-meter-head { display: flex; justify-content: space-between; }
.lic-bar { height: .55rem; border-radius: 1rem; background: var(--panel2, rgba(156,163,175,.18)); overflow: hidden; }
.lic-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd700, #e0a912); border-radius: 1rem; }
.lic-phones { margin-top: 1rem; display: grid; gap: .4rem; }
.lic-phones div { display: flex; gap: .5rem; flex-wrap: wrap; }
.lic-phones code { padding: .25rem .7rem; border-radius: .6rem; background: rgba(0,0,0,.25); color: var(--accent-soft, #ffed4e); }
.lic-drop { display: flex; align-items: center; justify-content: center; gap: .6rem; padding: 1.1rem; margin-bottom: .7rem; border: 2px dashed var(--line, rgba(255,215,0,.3)); border-radius: .9rem; color: var(--muted, #9ca3af); cursor: pointer; transition: border-color .2s, background .2s; }
.lic-drop:hover, .lic-drop.over { border-color: var(--accent, #ffd700); background: rgba(255,215,0,.06); }
.lic textarea { width: 100%; }

/* ---- لایسنس (کارت اصلی + حلقه‌ها + خط زمان) ---- */
.lic-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.lic-kicker { display: flex; align-items: center; gap: .45rem; color: var(--muted, #9ca3af); font-size: .88rem; }
.lic-name { margin: .7rem 0 .15rem !important; font-size: 1.9rem !important; color: var(--text, #f3f4f6) !important; }
.lic-id { color: var(--muted, #9ca3af); font-family: var(--mono, monospace); letter-spacing: .08em; text-align: right; font-size: .85rem; }
.lic-rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .8rem; margin-top: .4rem; }
.lic-ring { display: flex; align-items: center; gap: .9rem; padding: .8rem .9rem; border-radius: .9rem; background: rgba(255,255,255,.03); border: 1px solid var(--hair, rgba(156,163,175,.12)); }
.lic-donut { --p: 0; flex-shrink: 0; width: 4.2rem; height: 4.2rem; border-radius: 50%; display: grid; place-items: center; position: relative; background: conic-gradient(var(--accent, #ffd700) calc(var(--p) * 1%), var(--panel2, rgba(156,163,175,.2)) 0); }
.lic-donut::before { content: ''; position: absolute; inset: .42rem; border-radius: 50%; background: var(--surface, #1a1a2e); }
.lic-donut span { position: relative; font-weight: 800; font-size: .85rem; color: var(--accent, #ffd700); }
.lic-ring-t { display: grid; gap: .1rem; min-width: 0; }
.lic-ring-t b { color: var(--text, #f3f4f6); }
.lic-ring-t span { color: var(--accent-soft, #ffed4e); font-weight: 700; }
.lic-ring-t small { color: var(--muted, #9ca3af); font-size: .74rem; line-height: 1.7; }
.lic-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1rem; }
@media (max-width: 900px) { .lic-duo { grid-template-columns: 1fr; } }
.lic-tl { list-style: none; margin: .8rem 0 0; padding: 0 1.4rem 0 0; position: relative; display: grid; gap: 1rem; }
.lic-tl::before { content: ''; position: absolute; right: .35rem; top: .5rem; bottom: .5rem; width: 2px; background: var(--hair, rgba(156,163,175,.25)); }
.lic-tl li { position: relative; display: grid; gap: .15rem; }
.lic-tl li::before { content: ''; position: absolute; right: -1.4rem; top: .45rem; width: .8rem; height: .8rem; border-radius: 50%; background: var(--muted, #9ca3af); box-shadow: 0 0 0 4px var(--surface, #1a1a2e); }
.lic-tl li.warn::before { background: var(--warn, #fbbf24); } .lic-tl li.ok::before { background: var(--success, #4ade80); }
.lic-tl b { color: var(--text, #f3f4f6); } .lic-tl span { color: var(--muted, #9ca3af); font-size: .86rem; line-height: 1.9; }
